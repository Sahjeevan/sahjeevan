<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahjeevan Kshipra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ---- Design tokens ------------------------------------------------
     Deep indigo (Kutch's textile-dyeing tradition) as the anchor color
     rather than a default dashboard blue; warm clay for actions, sage
     for approved/settled states. "Kshipra" means swift/flowing -- the
     one signature touch is the thin flowing rule under the header,
     nothing more elaborate, since this is a working tool people will
     use daily, not a marketing page. */
  :root{
    --indigo:#20304A; --indigo-deep:#141F33; --clay:#B85C2E; --clay-deep:#8F4622;
    --sage:#4F7859; --sage-soft:#E7F0E8; --rust:#A63B32; --rust-soft:#FBEAE7;
    --amber-soft:#FBF1DD; --amber-ink:#7A5A1E;
    --paper:#FAF7F1; --card:#FFFFFF; --line:#E4DFD3; --line-strong:#D2CBB8;
    --ink:#241F19; --ink-soft:#6B6255; --ink-faint:#9A9182;
    --radius:10px; --font-display:'Fraunces',serif; --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;color:var(--indigo-deep)}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px}
  #login .wordmark{font-size:38px}
  #login .tagline{color:var(--ink-soft);font-size:15px;max-width:360px}
  .g-btn{display:flex;align-items:center;gap:10px;background:var(--indigo);color:#fff;border:none;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:500}
  .g-btn:hover{background:var(--indigo-deep)}

  header{background:var(--indigo);color:#fff;padding:0}
  header .bar{max-width:980px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
  header .brand{font-family:var(--font-display);font-size:20px}
  header .who{font-size:13px;opacity:.85;display:flex;align-items:center;gap:12px}
  header .who button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px}
  .river{height:3px;background:linear-gradient(90deg,var(--clay),var(--sage),var(--indigo-deep));opacity:.9}

  nav{max-width:980px;margin:0 auto;padding:14px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid var(--line-strong);padding:8px 14px;border-radius:999px;font-size:13.5px;color:var(--ink-soft)}
  nav button.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

  main{max-width:980px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .card h2{font-size:19px;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:500}
  .field{margin-bottom:14px}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink)
  }
  textarea{min-height:70px;resize:vertical}
  .btn{background:var(--clay);color:#fff;border:none;padding:10px 18px;border-radius:7px;font-size:14px;font-weight:500}
  .btn:hover{background:var(--clay-deep)}
  .btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--line-strong)}
  .btn.danger{background:var(--rust)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--ink-soft);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill.pending,.pill.leave_pending,.pill.comp_pending{background:var(--amber-soft);color:var(--amber-ink)}
  .pill.approved,.pill.leave_approved,.pill.comp_approved,.pill.booked,.pill.completed{background:var(--sage-soft);color:var(--sage)}
  .pill.rejected,.pill.leave_rejected,.pill.comp_rejected{background:var(--rust-soft);color:var(--rust)}
  .pill.progress{background:#E7EEF7;color:var(--indigo)}
  .muted{color:var(--ink-faint);font-size:13px}
  .msg{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px}
  .msg.err{background:var(--rust-soft);color:var(--rust)}
  .msg.ok{background:var(--sage-soft);color:var(--sage)}
  .empty{padding:22px 0;text-align:center;color:var(--ink-faint);font-size:13.5px}
  .stat{display:flex;gap:20px;flex-wrap:wrap}
  .stat div{flex:1;min-width:110px}
  .stat .n{font-family:var(--font-display);font-size:28px;color:var(--indigo-deep)}
  .stat .l{font-size:12px;color:var(--ink-soft)}
  .row-actions{display:flex;gap:6px}
  footer{max-width:980px;margin:0 auto;padding:10px 20px 40px;color:var(--ink-faint);font-size:12px}
</style>
</head>
<body>

<div id="login">
  <div class="wordmark">Sahjeevan Kshipra</div>
  <div class="tagline">Vehicle bookings, leave, and comp-off — a fresh build, running entirely separately from the current system.</div>
  <button class="g-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.34C2.42 15.98 5.48 18 9 18z"/><path fill="#fff" d="M3.95 10.69c-.18-.54-.28-1.11-.28-1.69s.1-1.15.28-1.69V4.97H.94A8.996 8.996 0 000 9c0 1.45.35 2.83.94 4.03l3.01-2.34z"/><path fill="#fff" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.42 2.02.94 4.97l3.01 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
    Sign in with Google
  </button>
  <div id="loginErr" class="msg err" style="display:none;max-width:360px"></div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="bar">
      <div class="brand">Sahjeevan Kshipra</div>
      <div class="who"><span id="whoName"></span><button onclick="signOut()">Sign out</button></div>
    </div>
  </header>
  <div class="river"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>Sahjeevan Kshipra &middot; a separate system from the one currently in use &middot; nothing here affects it</footer>
</div>

<script>
/* ============================================================
   0) Configuration
   ============================================================ */
const SUPABASE_URL = 'https://bcrsaycvmmnnhcrinyev.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MU3bPNSQC-zLH9ONp5PXbg_rPSHUbGW';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   1) Auth
   ============================================================ */
let ME = null;        // row from `users`
let SESSION = null;
let REF = { vehicles: [], drivers: [], projects: [] };
let IS_APPROVER = false;

async function signIn(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) showLoginError(error.message);
}
async function signOut(){
  await sb.auth.signOut();
  location.reload();
}
function showLoginError(msg){
  const el = document.getElementById('loginErr');
  el.textContent = msg;
  el.style.display = 'block';
}

sb.auth.onAuthStateChange((_event, session) => {
  SESSION = session;
  if (session) enterApp(); else showLogin();
});

function showLogin(){
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function enterApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const email = (SESSION.user.email || '').toLowerCase();
  const { data: me, error: meErr } = await sb.from('users').select('*').eq('email', email).maybeSingle();
  if (meErr || !me) {
    showLogin();
    showLoginError('Signed in as ' + email + ', but there is no matching record in Users yet. Ask an admin to add you.');
    await sb.auth.signOut();
    return;
  }
  ME = me;
  document.getElementById('whoName').textContent = me.name + ' \u00b7 ' + (me.role || '');

  // "Am I an approver for anything" -- checked directly, not guessed:
  // either I'm someone's leave/comp-off approver, or I'm a layer1/layer2
  // in some project's vehicle approval chain.
  const [{ data: la }, { data: pc }] = await Promise.all([
    sb.from('leave_approvers').select('staff_email').eq('approver_email', email).limit(1),
    sb.from('project_approval_chains').select('project_id').or(`layer1.eq.${email},layer2.eq.${email}`).limit(1),
  ]);
  IS_APPROVER = !!(la && la.length) || !!(pc && pc.length) || !!(me.is_admin || me.is_super_admin);

  await loadReferenceData();
  buildNav();
  route('home');
}

async function loadReferenceData(){
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/reference-data', {
      headers: { Authorization: 'Bearer ' + SESSION.access_token, apikey: SUPABASE_ANON_KEY }
    });
    const json = await res.json();
    if (json.ok) REF = json.data;
  } catch (e) { /* non-fatal -- forms that need this will show empty pickers */ }
}

/* ============================================================
   2) Calling the Edge Functions
   ============================================================ */
async function callFn(name, body){
  const res = await fetch(SUPABASE_URL + '/functions/v1/' + name, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + SESSION.access_token,
      apikey: SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(body || {}),
  });
  let json;
  try { json = await res.json(); } catch { json = { ok:false, error:'Unexpected response' }; }
  return json;
}

/* ============================================================
   3) Nav + routing
   ============================================================ */
const TABS = [
  ['home', 'Home'],
  ['leave', 'Leave'],
  ['compoff', 'Comp-off'],
  ['vehicles', 'Vehicles'],
  ['approvals', 'Approvals'],
];
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS
    .filter(([id]) => id !== 'approvals' || IS_APPROVER)
    .map(([id, label]) => `<button data-tab="${id}" onclick="route('${id}')">${label}</button>`)
    .join('');
}
function setActiveTab(id){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
}
async function route(id){
  setActiveTab(id);
  const main = document.getElementById('main');
  main.innerHTML = '<p class="muted">Loading\u2026</p>';
  try {
    if (id === 'home') await renderHome(main);
    else if (id === 'leave') await renderLeave(main);
    else if (id === 'compoff') await renderCompOff(main);
    else if (id === 'vehicles') await renderVehicles(main);
    else if (id === 'approvals') await renderApprovals(main);
  } catch (e) {
    main.innerHTML = `<div class="msg err">Something went wrong loading this: ${esc(e.message || e)}</div>`;
  }
}

/* ============================================================
   4) Small helpers
   ============================================================ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(v){
  if (!v) return '\u2014';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return v;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${+m[3]} ${months[+m[2]-1]} ${m[1]}`;
}
function pill(status){ return `<span class="pill ${status}">${String(status).replace('_',' ')}</span>`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function msg(text, kind){ return `<div class="msg ${kind}">${esc(text)}</div>`; }

/* ============================================================
   5) Home
   ============================================================ */
async function renderHome(main){
  let balance = null;
  try {
    const r = await callFn('leave-balance', {});
    if (r.ok) balance = r.data;
  } catch {}
  main.innerHTML = `
    <div class="card">
      <h2>Welcome, ${esc(ME.name)}</h2>
      <p class="muted">${esc(ME.role || '')}${ME.is_admin || ME.is_super_admin ? ' \u00b7 admin' : ''}${IS_APPROVER ? ' \u00b7 approver' : ''}</p>
    </div>
    ${balance ? `
    <div class="card">
      <h2>Leave balance, ${balance.year}</h2>
      <div class="stat">
        <div><div class="n">${balance.openingCasual}</div><div class="l">Yearly casual allowance</div></div>
        <div><div class="n">${balance.used}</div><div class="l">Used so far</div></div>
        <div><div class="n">${balance.remaining}</div><div class="l">Remaining</div></div>
      </div>
    </div>` : ''}
  `;
}

/* ============================================================
   6) Leave
   ============================================================ */
async function renderLeave(main){
  main.innerHTML = `
    <div class="card">
      <h2>Raise leave</h2>
      <div id="leaveMsg"></div>
      <div class="grid2">
        <div class="field"><label>Type</label>
          <select id="lv_type"><option value="casual">Casual</option><option value="sick">Sick</option></select>
        </div>
        <div></div>
        <div class="field"><label>From</label><input type="date" id="lv_from" value="${todayISO()}"></div>
        <div class="field"><label>To</label><input type="date" id="lv_to" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>Reason (optional)</label><textarea id="lv_reason"></textarea></div>
      <button class="btn" id="lv_submit" onclick="submitLeave()">Raise leave</button>
    </div>
    <div class="card">
      <h2>My leave requests</h2>
      <div id="myLeaves"><p class="muted">Loading\u2026</p></div>
    </div>
  `;
  loadMyLeaves();
}
async function submitLeave(){
  const btn = document.getElementById('lv_submit'); btn.disabled = true;
  const body = {
    leave_type: document.getElementById('lv_type').value,
    from_date: document.getElementById('lv_from').value,
    to_date: document.getElementById('lv_to').value,
    reason: document.getElementById('lv_reason').value || null,
  };
  const r = await callFn('leave-request', body);
  const el = document.getElementById('leaveMsg');
  if (r.ok) { el.innerHTML = msg('Raised ' + r.data.display_id, 'ok'); loadMyLeaves(); }
  else el.innerHTML = msg(r.error || 'Could not raise leave', 'err');
  btn.disabled = false;
}
async function loadMyLeaves(){
  const { data, error } = await sb.from('leaves').select('*').eq('by_email', ME.email).order('created_at', { ascending:false });
  const host = document.getElementById('myLeaves');
  if (error) { host.innerHTML = msg(error.message, 'err'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">No leave requests yet.</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>Type</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody>
    ${data.map(l => `<tr><td>${esc(l.leave_type)}</td><td>${fmtD(l.from_date)}</td><td>${fmtD(l.to_date)}</td><td>${pill(l.status)}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ============================================================
   7) Comp-off
   ============================================================ */
async function renderCompOff(main){
  main.innerHTML = `
    <div class="card">
      <h2>Raise comp-off</h2>
      <div id="coMsg"></div>
      <div class="grid2">
        <div class="field"><label>Worked date</label><input type="date" id="co_date" value="${todayISO()}"></div>
        <div class="field"><label>Days</label><input type="number" id="co_days" value="1" min="0.5" step="0.5"></div>
      </div>
      <div class="field"><label>Reason (optional)</label><textarea id="co_reason"></textarea></div>
      <button class="btn" id="co_submit" onclick="submitCompOff()">Raise comp-off</button>
    </div>
    <div class="card">
      <h2>My comp-off requests</h2>
      <div id="myCompOff"><p class="muted">Loading\u2026</p></div>
    </div>
  `;
  loadMyCompOff();
}
async function submitCompOff(){
  const btn = document.getElementById('co_submit'); btn.disabled = true;
  const body = {
    worked_date: document.getElementById('co_date').value,
    days: Number(document.getElementById('co_days').value) || 1,
    reason: document.getElementById('co_reason').value || null,
  };
  const r = await callFn('comp-off-request', body);
  const el = document.getElementById('coMsg');
  if (r.ok) { el.innerHTML = msg('Raised ' + r.data.display_id, 'ok'); loadMyCompOff(); }
  else el.innerHTML = msg(r.error || 'Could not raise comp-off', 'err');
  btn.disabled = false;
}
async function loadMyCompOff(){
  const { data, error } = await sb.from('comp_off').select('*').eq('by_email', ME.email).order('created_at', { ascending:false });
  const host = document.getElementById('myCompOff');
  if (error) { host.innerHTML = msg(error.message, 'err'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">No comp-off requests yet.</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>Worked</th><th>Days</th><th>Status</th></tr></thead><tbody>
    ${data.map(c => `<tr><td>${fmtD(c.worked_date)}</td><td>${c.days}</td><td>${pill(c.status)}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ============================================================
   8) Vehicles
   ============================================================ */
async function renderVehicles(main){
  const projectOpts = (REF.projects || []).map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  main.innerHTML = `
    <div class="card">
      <h2>Raise a vehicle request</h2>
      <div id="vrMsg"></div>
      <div class="grid2">
        <div class="field"><label>Project</label>
          <select id="vr_project" onchange="onProjectChange()"><option value="">Select\u2026</option>${projectOpts}</select>
        </div>
        <div class="field"><label>Budget head</label><select id="vr_head"><option value="">Select a project first</option></select></div>
        <div class="field"><label>Date</label><input type="date" id="vr_date" value="${todayISO()}"></div>
        <div class="field"><label>Time (optional)</label><input type="time" id="vr_time"></div>
      </div>
      <div class="field"><label>Reason</label><textarea id="vr_reason"></textarea></div>
      <button class="btn" id="vr_submit" onclick="submitVehicleRequest()">Raise request</button>
    </div>
    <div class="card">
      <h2>My vehicle requests</h2>
      <div id="myVehicles"><p class="muted">Loading\u2026</p></div>
    </div>
  `;
  loadMyVehicleRequests();
}
function onProjectChange(){
  const name = document.getElementById('vr_project').value;
  const proj = (REF.projects || []).find(p => p.name === name);
  const heads = proj ? (proj.project_budget_heads || []).filter(h => h.active) : [];
  document.getElementById('vr_head').innerHTML = heads.length
    ? heads.map(h => `<option value="${esc(h.budget_head)}">${esc(h.budget_head)}</option>`).join('')
    : '<option value="">No budget heads found</option>';
}
async function submitVehicleRequest(){
  const btn = document.getElementById('vr_submit'); btn.disabled = true;
  const body = {
    project: document.getElementById('vr_project').value,
    budget_head: document.getElementById('vr_head').value,
    request_date: document.getElementById('vr_date').value,
    request_time: document.getElementById('vr_time').value || null,
    reason: document.getElementById('vr_reason').value || null,
  };
  const r = await callFn('vehicle-request', body);
  const el = document.getElementById('vrMsg');
  if (r.ok) { el.innerHTML = msg('Raised ' + r.data.display_id, 'ok'); loadMyVehicleRequests(); }
  else el.innerHTML = msg(r.error || 'Could not raise request', 'err');
  btn.disabled = false;
}
async function loadMyVehicleRequests(){
  const { data, error } = await sb.from('vehicle_requests').select('*').eq('by_email', ME.email).order('created_at', { ascending:false });
  const host = document.getElementById('myVehicles');
  if (error) { host.innerHTML = msg(error.message, 'err'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">No vehicle requests yet.</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>Date</th><th>Vehicle</th><th>Driver</th><th>Status</th></tr></thead><tbody>
    ${data.map(v => `<tr><td>${fmtD(v.request_date)}</td><td>${esc(v.vehicle_number||'\u2014')}</td><td>${esc(v.driver_name||'\u2014')}</td><td>${pill(v.status)}${v.escalated?' <span class="muted">(escalated)</span>':''}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ============================================================
   9) Approvals (only shown to approvers/admins)
   ============================================================ */
async function renderApprovals(main){
  main.innerHTML = `
    <div class="card"><h2>Leave requests awaiting you</h2><div id="apLeaves"><p class="muted">Loading\u2026</p></div></div>
    <div class="card"><h2>Comp-off requests awaiting you</h2><div id="apCompOff"><p class="muted">Loading\u2026</p></div></div>
    <div class="card"><h2>Vehicle requests awaiting you</h2><div id="apVehicles"><p class="muted">Loading\u2026</p></div></div>
    ${(ME.is_admin || ME.is_super_admin) ? `<div class="card"><h2>Approved vehicle requests \u2014 book / start / close</h2><div id="apAdmin"><p class="muted">Loading\u2026</p></div></div>` : ''}
  `;
  loadApprovalLeaves();
  loadApprovalCompOff();
  loadApprovalVehicles();
  if (ME.is_admin || ME.is_super_admin) loadAdminVehicleActions();
}

async function loadApprovalLeaves(){
  const { data, error } = await sb.from('leaves').select('*').eq('status','leave_pending').order('created_at');
  const host = document.getElementById('apLeaves');
  if (error) { host.innerHTML = msg(error.message,'err'); return; }
  const mine = (data||[]).filter(l => l.approver_email?.toLowerCase() === ME.email.toLowerCase() || ME.is_admin || ME.is_super_admin);
  if (!mine.length) { host.innerHTML = '<div class="empty">Nothing waiting on you.</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>Who</th><th>Type</th><th>From</th><th>To</th><th></th></tr></thead><tbody>
    ${mine.map(l => `<tr><td>${esc(l.by_name)}</td><td>${esc(l.leave_type)}</td><td>${fmtD(l.from_date)}</td><td>${fmtD(l.to_date)}</td>
      <td class="row-actions">
        <button class="btn sm" onclick="decideLeave('${l.display_id}','approved',this)">Approve</button>
        <button class="btn sm danger" onclick="decideLeave('${l.display_id}','rejected',this)">Reject</button>
      </td></tr>`).join('')}
  </tbody></table>`;
}
async function decideLeave(id, decision, btn){
  btn.closest('tr').style.opacity = .5;
  const r = await callFn('leave-decide', { display_id: id, decision });
  if (!r.ok) alert(r.error || 'Could not decide');
  loadApprovalLeaves();
}

async function loadApprovalCompOff(){
  const { data, error } = await sb.from('comp_off').select('*').eq('status','comp_pending').order('created_at');
  const host = document.getElementById('apCompOff');
  if (error) { host.innerHTML = msg(error.message,'err'); return; }
  const mine = (data||[]).filter(c => c.approver_email?.toLowerCase() === ME.email.toLowerCase() || ME.is_admin || ME.is_super_admin);
  if (!mine.length) { host.innerHTML = '<div class="empty">Nothing waiting on you.</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>Who</th><th>Worked</th><th>Days</th><th></th></tr></thead><tbody>
    ${mine.map(c => `<tr><td>${esc(c.by_name)}</td><td>${fmtD(c.worked_date)}</td><td>${c.days}</td>
      <td class="row-actions">
        <button class="btn sm" onclick="decideCompOff('${c.display_id}','approved',this)">Approve</button>
        <button class="btn sm danger" onclick="decideCompOff('${c.display_id}','rejected',this)">Reject</button>
      </td></tr>`).join('')}
  </tbody></table>`;
}
async function decideCompOff(id, decision, btn){
  btn.closest('tr').style.opacity = .5;
  const r = await callFn('comp-off-decide', { display_id: id, decision });
  if (!r.ok) alert(r.error || 'Could not decide');
  loadApprovalCompOff();
}

async function loadApprovalVehicles(){
  const { data, error } = await sb.from('vehicle_requests').select('*').eq('status','pending').order('created_at');
  const host = document.getElementById('apVehicles');
  if (error) { host.innerHTML = msg(error.message,'err'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">Nothing pending.</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>Who</th><th>Date</th><th></th></tr></thead><tbody>
    ${data.map(v => `<tr><td>${esc(v.by_name)}</td><td>${fmtD(v.request_date)}</td>
      <td class="row-actions">
        <button class="btn sm" onclick="decideVehicle('${v.display_id}','approved',this)">Approve</button>
        <button class="btn sm danger" onclick="decideVehicle('${v.display_id}','rejected',this)">Reject</button>
        ${!v.escalated ? `<button class="btn sm ghost" onclick="escalateVehicle('${v.display_id}',this)">Escalate</button>` : '<span class="muted">escalated</span>'}
      </td></tr>`).join('')}
  </tbody></table>`;
}
async function decideVehicle(id, decision, btn){
  btn.closest('tr').style.opacity = .5;
  const r = await callFn('vehicle-decide', { display_id: id, decision });
  if (!r.ok) alert(r.error || 'Could not decide');
  loadApprovalVehicles();
}
async function escalateVehicle(id, btn){
  const r = await callFn('vehicle-escalate', { display_id: id });
  if (!r.ok) alert(r.error || 'Could not escalate');
  loadApprovalVehicles();
}

async function loadAdminVehicleActions(){
  const { data, error } = await sb.from('vehicle_requests').select('*').in('status',['approved','booked','progress']).order('created_at');
  const host = document.getElementById('apAdmin');
  if (error) { host.innerHTML = msg(error.message,'err'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">Nothing to action.</div>'; return; }
  const vehicleOpts = (REF.vehicles||[]).map(v=>`<option value="${esc(v.vehicle_number)}">${esc(v.vehicle_number)}</option>`).join('');
  const driverOpts = (REF.drivers||[]).map(d=>`<option value="${esc(d.driver_name)}">${esc(d.driver_name)}</option>`).join('');
  host.innerHTML = data.map(v => {
    if (v.status === 'approved') return `
      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label>${esc(v.display_id)} \u2014 ${esc(v.by_name)}, ${fmtD(v.request_date)} \u2014 book a vehicle</label>
        <div class="grid2">
          <select id="book_veh_${v.request_no}">${vehicleOpts}</select>
          <select id="book_drv_${v.request_no}">${driverOpts}</select>
        </div>
        <button class="btn sm" style="margin-top:8px" onclick="bookVehicle('${v.display_id}',${v.request_no},this)">Book</button>
      </div>`;
    if (v.status === 'booked') return `
      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label>${esc(v.display_id)} \u2014 ${esc(v.vehicle_number)} / ${esc(v.driver_name)} \u2014 start trip</label>
        <input type="number" id="start_km_${v.request_no}" placeholder="Opening odometer (km)">
        <button class="btn sm" style="margin-top:8px" onclick="startTrip('${v.display_id}',${v.request_no},this)">Start trip</button>
      </div>`;
    return `
      <div class="field" style="border-top:1px solid var(--line);padding-top:12px">
        <label>${esc(v.display_id)} \u2014 in progress since ${fmtD(v.request_date)}, opened at ${v.start_km} km \u2014 close trip</label>
        <input type="number" id="end_km_${v.request_no}" placeholder="Closing odometer (km)">
        <button class="btn sm" style="margin-top:8px" onclick="closeTrip('${v.display_id}',${v.request_no},this)">Close trip</button>
      </div>`;
  }).join('');
}
async function bookVehicle(id, reqNo, btn){
  const body = { display_id:id, vehicle_number:document.getElementById('book_veh_'+reqNo).value, driver_name:document.getElementById('book_drv_'+reqNo).value };
  const r = await callFn('vehicle-book', body);
  if (!r.ok) alert(r.error || 'Could not book'); loadAdminVehicleActions();
}
async function startTrip(id, reqNo, btn){
  const body = { display_id:id, start_km:Number(document.getElementById('start_km_'+reqNo).value) };
  const r = await callFn('vehicle-start', body);
  if (!r.ok) alert(r.error || 'Could not start trip'); loadAdminVehicleActions();
}
async function closeTrip(id, reqNo, btn){
  const body = { display_id:id, end_km:Number(document.getElementById('end_km_'+reqNo).value) };
  const r = await callFn('vehicle-close', body);
  if (!r.ok) alert(r.error || 'Could not close trip'); loadAdminVehicleActions();
}

   10) Boot
   ============================================================ */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
  if (session) enterApp(); else showLogin();
})();
</script>
