<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahjeevan Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2b50">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sahjeevan Ops">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   SAHJEEVAN OPERATIONS — stylesheet
   ------------------------------------------------------------
   NOTE: index.html carries these same styles inline and does NOT
   link this file. The app is deliberately one self-contained
   file so it can be opened from anywhere, including offline.

   This copy is kept in sync for reference, or if you ever want to
   split the CSS out. To use it, add to <head>:
       <link rel="stylesheet" href="styles.css">
   and delete the <style> block from index.html. Keeping BOTH will
   not break anything, but you would then have to edit two files
   for every change.

   Palette grounded in Kachchh/Banni: Ajrakh indigo, grassland
   green, salt/sand neutrals, madder red used sparingly.
   ============================================================ */

:root{
  --indigo:#1d2b50;--indigo-700:#2a3d6e;--indigo-500:#3c558f;
  --grass:#4f7d3f;--grass-soft:#e8f0e2;
  --madder:#a23b24;--madder-soft:#f6e6e0;
  --amber:#c8861a;--amber-soft:#f8eed8;
  --sand:#f3efe6;--bone:#fbf9f4;
  --ink:#222630;--ink-soft:#5a6072;
  --line:#e2ddd0;--line-strong:#cfc8b6;--white:#ffffff;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(29,43,80,.06),0 8px 24px rgba(29,43,80,.06);
  --shadow-lg:0 12px 40px rgba(29,43,80,.16);
  --font:"Hanken Grotesk","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
:lang(hi),:lang(gu){font-weight:400}
button{font-family:inherit;cursor:pointer}
a{color:var(--indigo-500)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--bone);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);max-width:440px;width:100%;overflow:hidden}
.login-head{background:var(--indigo);color:#fff;padding:30px 30px 26px;position:relative}
.login-head .mark{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.login-head .mark .glyph{width:58px;height:58px;flex:none}
.login-head h1{font-size:21px;letter-spacing:-.02em}
.login-head p{margin:4px 0 0;color:#b9c4dd;font-size:13.5px}
.weave{height:8px;background:repeating-linear-gradient(135deg,var(--grass) 0 9px,var(--amber) 9px 18px,var(--madder) 18px 27px,var(--indigo-500) 27px 36px)}
.login-body{padding:24px 30px 30px}
.login-body label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.login-hint{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.login-status{margin-top:16px;font-size:13px;line-height:1.5;text-align:center}
.login-status.err{color:var(--madder)}
.login-status.busy{color:var(--ink-soft)}
.login-setup{margin-top:16px;font-size:12.5px;color:var(--ink-soft);background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:10px;padding:12px 13px;line-height:1.55;text-align:left}
.login-setup b{color:var(--ink)}
.login-setup code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}


.app{display:none;min-height:calc(100vh - 33px)}
.app.on{display:grid;grid-template-columns:230px 1fr}
.sidebar{background:var(--indigo);color:#cdd6ea;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 33px)}
.brand{padding:16px 16px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .glyph{width:46px;height:46px;flex:none}
/* The logo is a dark-brown wordmark, so it needs a light tile to sit on
   against the indigo chrome. */
.glyph.has-logo{background:#fff;border-radius:9px;padding:4px;box-sizing:border-box;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}
.login-head .mark .glyph.has-logo{border-radius:11px;padding:5px}
.brand b{color:#fff;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:#8c9bc0;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav .grp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6f7ea6;padding:12px 12px 5px}
.nav button{background:transparent;border:0;color:#cdd6ea;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:11px;width:100%;transition:background .12s,color .12s}
.nav button .ic{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--bone);color:var(--indigo);font-weight:700}
.nav button.active .ic{opacity:1}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .who{font-size:13px;color:#fff;font-weight:600}
.side-foot .who small{display:block;color:#8c9bc0;font-weight:500;font-size:11.5px}
.side-foot button{margin-top:9px;width:100%;background:rgba(255,255,255,.08);border:0;color:#dfe6f5;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600}
.side-foot button:hover{background:rgba(255,255,255,.16)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--bone);border-bottom:1px solid var(--line);padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:17px;flex:1;min-width:0}
.topbar h2 span{display:block;font-size:12px;color:var(--ink-soft);font-weight:500}
.lang{display:flex;background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.lang button.on{background:var(--indigo);color:#fff}
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto}

.mobnav{display:none}.hamb{display:none}

.card{background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.field .req{color:var(--madder)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:9px;padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo-500);box-shadow:0 0 0 3px rgba(60,85,143,.14)}
textarea{resize:vertical;min-height:64px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;background:var(--indigo);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,filter .12s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--indigo);border:1px solid var(--line-strong)}
.btn.grass{background:var(--grass)}.btn.madder{background:var(--madder)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pagehead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h3{font-size:19px}
.pagehead p{margin:3px 0 0;color:var(--ink-soft);font-size:13.5px}
.pagehead .sp{flex:1}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:#eceae3;color:#7a7565}
.pill.pending{background:var(--amber-soft);color:#9a6712}
.pill.approved{background:var(--grass-soft);color:#3a5e2e}
.pill.rejected{background:var(--madder-soft);color:#82301c}
.pill.booked{background:#e2e9f7;color:#2a3d6e}
.pill.progress{background:#e0eef0;color:#1c6470}
.pill.completed{background:#e7e4ee;color:#4b3d6e}
.pill.issued{background:var(--amber-soft);color:#9a6712}
.pill.returned{background:var(--grass-soft);color:#3a5e2e}
.pill.overdue{background:var(--madder-soft);color:#82301c}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--bone)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line);background:#f7f4ec}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:#faf8f2}
.muted{color:var(--ink-soft)}
.kvs{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.kvs div{display:flex;gap:8px}
.kvs span{color:var(--ink-soft);min-width:140px;font-weight:600;font-size:12.5px}

.stat{display:flex;flex-direction:column;gap:2px;background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink-soft);font-weight:600}
.stat.g .n{color:var(--grass)}.stat.a .n{color:var(--amber)}.stat.i .n{color:var(--indigo)}.stat.m .n{color:var(--madder)}

.notice{border-radius:var(--radius);padding:13px 15px;font-size:13.5px;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.info{background:#e9eefb;color:#2a3d6e;border:1px solid #cdd9f3}
.notice.warn{background:var(--amber-soft);color:#7d5510;border:1px solid #ecd9a8}
.notice.privacy{background:var(--grass-soft);color:#33502a;border:1px solid #c6dcb8}

.minirow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.minirow .idx{width:26px;height:26px;border-radius:7px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.minirow .x{background:#fff;border:1px solid var(--line-strong);color:var(--madder);border-radius:8px;padding:0;width:34px;height:38px;font-size:18px;line-height:1}
.travrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}

/* real map containers */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,52,.5);display:none;place-items:center;z-index:1000;padding:18px}
.modal-bg.on{display:grid}
.modal{background:var(--bone);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{flex:1;font-size:17px}
.modal-head .x{background:#fff;border:1px solid var(--line-strong);border-radius:8px;width:32px;height:32px;font-size:18px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--indigo);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:2000;opacity:0;transition:transform .25s,opacity .25s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.hide{display:none!important}

.confgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.taglist{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.tag{background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.tag button{border:0;background:transparent;color:var(--madder);font-size:15px;line-height:1;padding:0}

.pickreadout{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
.pickreadout b{color:var(--ink)}
.slip-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13px;color:#000}
.slip-preview h4{font-size:15px;border-bottom:2px solid #000;padding-bottom:6px;margin:0 0 10px}
.slip-preview .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;margin-bottom:10px;font-size:12.5px}
.slip-preview table{width:100%;border:1px solid #000;font-size:11.5px;border-collapse:collapse;margin-top:6px}
.slip-preview th,.slip-preview td{border:1px solid #000;padding:5px}
.field-card{display:flex;gap:12px;align-items:center;background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);min-width:230px}
.field-card .vic{width:38px;height:38px;border-radius:9px;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:none}
.field-card .vic svg{width:20px;height:20px}
.field-card b{font-size:13.5px;display:block}
.field-card .sub{font-size:11.5px;color:var(--ink-soft)}

@media (max-width:860px){
  .app.on{grid-template-columns:1fr}
  .sidebar{display:none}
  .hamb{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line-strong);background:#fff;border-radius:9px}
  .content{padding:16px 14px 90px}
  .grid2,.grid3,.confgrid{grid-template-columns:1fr}
  .minirow{grid-template-columns:24px 1fr auto;grid-auto-rows:auto}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bone);border-top:1px solid var(--line);z-index:60;padding:6px 6px env(safe-area-inset-bottom);justify-content:space-around}
  .mobnav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);font-size:10.5px;font-weight:600;padding:6px 8px;border-radius:9px;flex:1}
  .mobnav button .ic{width:21px;height:21px}
  .mobnav button.active{color:var(--indigo);background:var(--grass-soft)}
  .drawer-bg{position:fixed;inset:0;background:rgba(20,28,52,.5);z-index:90;display:none}
  .drawer-bg.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:264px;background:var(--indigo);z-index:100;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column}
  .drawer.on{transform:none}
}
@media (min-width:861px){.drawer,.drawer-bg{display:none!important}}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;inset:0;padding:0;background:#fff;display:block!important}
}
#printArea{display:none}
.slip{max-width:720px;margin:0 auto;padding:28px;font-size:13px;color:#000}
.slip h2{font-size:18px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
.slip .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:14px}
.slip .grid div{display:flex;gap:6px}
.slip .grid b{min-width:130px}
.slip table{width:100%;border:1px solid #000;border-collapse:collapse;font-size:12px;min-width:0}
/* Gap #39: headers repeat on every printed page of a long report. */
.slip thead{display:table-header-group}
.slip tr{page-break-inside:avoid}
/* Gap #40: striping is what makes a 200-row printed table readable. */
.slip tbody tr:nth-child(even){background:#f4f4f4}
/* Gap #38: numeric columns right-aligned with even digit widths. */
.slip td.num,.slip th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.slip.wide{font-size:9.5px}
.slip.wide th,.slip.wide td{padding:3px 5px;word-break:break-word}
.slip th,.slip td{border:1px solid #000;padding:6px}
.slip .signs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
.slip .signs div{border-top:1px solid #000;padding-top:6px;font-size:11px;text-align:center}
/* ===== Production additions ===== */
.routechips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 10px}
.routechips button{background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--indigo)}
.routechips button:hover{border-color:var(--indigo-500);background:#fbfcff}
.seg{display:flex;background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--indigo);color:#fff}
.vendorbox{background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:var(--radius);padding:13px 15px;margin-top:10px}
.logoprev{width:76px;height:76px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden}
.logoprev img{width:100%;height:100%;object-fit:contain}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px;border-bottom:1px solid var(--line);padding-bottom:0}
.subtabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:-1px}
.subtabs button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.contactline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.contactline a{font-weight:600}
.editbadge{font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid #ecd9a8;padding:2px 7px;border-radius:999px}
.pill.cancelled{background:#eceae3;color:#7a7565}
.pill.leave_pending{background:var(--amber-soft);color:#9a6712}
.pill.leave_approved{background:var(--grass-soft);color:#3a5e2e}
.pill.leave_rejected{background:var(--madder-soft);color:#82301c}


/* ===== report filter bar ===== */
.repbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:0 0 12px;
  padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.repbar label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.repbar input,.repbar select{height:36px;padding:4px 8px;font-size:13px;min-width:132px}
.repbar .repspace{flex:1 1 auto;min-width:0}
.repbar .btn{height:36px}

/* ===== mobile & tablet ===== */
@media(max-width:860px){
  .repbar{padding:10px}
  .repbar label{flex:1 1 46%;min-width:0}
  .repbar input,.repbar select{min-width:0;width:100%}
  .repbar .repspace{display:none}
  .repbar .btn{flex:1 1 auto}
  .row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .grid2{grid-template-columns:1fr}
  .confgrid{grid-template-columns:1fr}
  table{font-size:12.5px}
  th,td{padding:8px 9px}
  .modal{max-height:88vh}
  .modal-body{max-height:62vh;overflow:auto}
  .modal-foot{flex-wrap:wrap}
  .modal-foot .btn{flex:1 1 auto}
  .btn{min-height:40px}          /* comfortable tap target */
  .btn.sm{min-height:34px}
  .stafftabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .stafftabs button{white-space:nowrap}
  h2{font-size:18px}
}
@media(max-width:420px){
  .repbar label{flex:1 1 100%}
  .row{grid-template-columns:1fr 1fr}
  .stat .n{font-size:20px}
}
/* keep long ids and emails from forcing horizontal scroll */
td,th{word-break:normal;overflow-wrap:break-word}

/* ===== update banner ===== */
.updatebar{position:fixed;left:12px;right:12px;bottom:12px;z-index:1200;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--indigo);color:#fff;padding:12px 14px;border-radius:12px;
  box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600}
.updatebar span{flex:1 1 180px;min-width:0}
.updatebar .btn{height:34px;flex:0 0 auto}
.updatebar .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
@media(min-width:861px){ .updatebar{left:auto;right:20px;bottom:20px;max-width:440px} }


/* ===== additions for Sahjeevan Operations (new system) (kept separate from the base
   stylesheet above on purpose, so this file stays easy to diff against
   the original styles.css if the two are ever compared) ===== */
.statgrid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.langbtn{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:inherit;cursor:pointer;transition:background .12s,color .12s}
.langbtn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.statgrid .stat{flex:1;min-width:140px}
.empty{padding:28px 0;text-align:center;color:var(--ink-soft);font-size:13.5px}
.subtle-note{font-size:12px;color:var(--ink-soft);margin-top:10px}

</style>
</head>

function t(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key; }
function setLang(l){
  LANG = l;
  localStorage.setItem('sahjeevan_lang', l);
  document.querySelectorAll('.langbtn').forEach(b => b.classList.toggle('active', b.dataset.lang===l));
  const tagline = document.getElementById('loginTagline');
  const signInText = document.getElementById('loginSignInText');
  if (tagline) tagline.textContent = t('tagline');
  if (signInText) signInText.textContent = t('sign_in');
  // Before sign-in, ME/nav don't exist yet -- only the login screen needs
  // updating. After sign-in, refresh the nav labels and re-render the
  // current screen so it picks up the new language immediately.
  if (!ME) return;
  buildNav();
  const active = document.querySelector('.nav button.active, .mobnav button.active');
  route(active ? active.dataset.tab : 'home', true);
}

/* ============================================================
   1) Auth
   ============================================================ */
let ME = null, SESSION = null, IS_APPROVER = false;
let REF = { vehicles: [], drivers: [], projects: [] };
/* Declared holidays, loaded once at sign-in. Used by the on-screen leave
   register so its day counts agree with what the backend deducts. */
let HOLIDAY_SET = new Set();

async function signIn(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) setLoginStatus(error.message, true);
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }
function setLoginStatus(text, isErr){
  const el = document.getElementById('loginStatus');
  el.textContent = text || '';
  el.className = 'login-status' + (isErr ? ' err' : ' busy');
}

let ENTERING = false;   // guards against running enterApp twice at once
sb.auth.onAuthStateChange((_e, session) => {
  SESSION = session;
  if (session) enterApp(); else showLogin();
});

function showLogin(){
  document.getElementById('loginView').style.display = 'grid';
  document.getElementById('app').classList.remove('on');
}

async function enterApp(){
  // Supabase fires its own initial auth event on page load, on top of the
  // explicit getSession() check at the bottom of this file -- both call
  // enterApp(). Without this guard, sign-in runs twice at once, which is
  // wasteful and could leave two competing sets of data racing to render.
  if (ENTERING) return;
  ENTERING = true;
  try {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('app').classList.add('on');

    const email = (SESSION.user.email || '').toLowerCase();
    const { data: me, error: meErr } = await sb.from('users').select('*').eq('email', email).maybeSingle();
    if (meErr || !me) {
      await sb.auth.signOut();
      showLogin();
      setLoginStatus('Signed in as ' + email + ', but there is no matching record in Users yet. Ask an admin to add you.', true);
      return;
    }
    ME = me;
    document.getElementById('whoName').innerHTML = esc(me.name) + '<small>' + esc(me.role||'') + '<br>' + esc(me.email) + '</small>';
    document.getElementById('whoName2').textContent = me.name;

    try {
      const [{ data: la }, { data: pc }] = await Promise.all([
        sb.from('leave_approvers').select('staff_email').eq('approver_email', email).limit(1),
        sb.from('project_approval_chains').select('project_id').or(`layer1.eq.${email},layer2.eq.${email}`).limit(1),
      ]);
      IS_APPROVER = !!(la && la.length) || !!(pc && pc.length) || !!(me.is_admin || me.is_super_admin);
    } catch (e) {
      // Not fatal -- worst case, an approver doesn't see the Approvals
      // tab this session. Better than the whole app failing to open.
      IS_APPROVER = !!(me.is_admin || me.is_super_admin);
    }

    await Promise.all([loadReferenceData(), loadHolidays()]);
    buildNav();
    resetIdleTimer();
    // Land on whatever screen the URL names, so a refresh or a shared
    // link returns to the right place rather than always Home.
    const wanted = (location.hash || '').replace('#/','');
    const valid = TABS.some(([tid]) => tid === wanted);
    await route(valid ? wanted : 'home', true);
  } catch (e) {
    // Whatever else goes wrong here, the person should see a real error
    // instead of a blank page with no menu -- that silence is exactly
    // what made the last bug hard to diagnose from a screenshot alone.
    document.getElementById('content').innerHTML =
      `<div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Something went wrong opening the app: ${esc(e.message||e)}</div></div>`;
  } finally {
    ENTERING = false;
  }
}

/* Last-resort safety net: if anything ELSE throws that isn't already
   caught above, surface it as a toast instead of leaving a silent blank
   screen -- so the next time something breaks, there's at least a visible
   message to report back, rather than a screenshot of empty space. */
window.addEventListener('error', e => { try { toast('Error: ' + (e.message||'something went wrong')); } catch {} });
window.addEventListener('unhandledrejection', e => { try { toast('Error: ' + (e.reason?.message||e.reason||'something went wrong')); } catch {} });

async function loadHolidays(){
  try {
    const { data } = await sb.from('holidays').select('holiday_date');
    HOLIDAY_SET = new Set((data||[]).map(h=>String(h.holiday_date).slice(0,10)));
  } catch { /* non-fatal: register still renders, day counts fall back to weekends only */ }
}
async function loadReferenceData(){
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/reference-data', {
      headers: { Authorization: 'Bearer ' + SESSION.access_token, apikey: SUPABASE_ANON_KEY }
    });
    const json = await res.json();
    if (json.ok) REF = json.data;
  } catch (e) {}
}

/* ============================================================
   2) Calling the Edge Functions
   ============================================================ */
async function callFn(name, body){
  const res = await fetch(SUPABASE_URL + '/functions/v1/' + name, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:'Bearer '+SESSION.access_token, apikey:SUPABASE_ANON_KEY },
    body: JSON.stringify(body || {}),
  });
  try { return await res.json(); } catch { return { ok:false, error:'Unexpected response' }; }
}

/* Fire-and-forget email notification, mirroring the old system's notify().
   Deliberately never awaited by callers in a way that can block or fail
   their action: the write already succeeded before this runs, so a mail
   problem must never look like a failed booking. */
function notify(event, payload){
  try {
    callFn('notify', { event, ...(payload||{}) }).catch(()=>{});
  } catch { /* ignore */ }
}

/* ============================================================
   2b) Inactivity auto-logout (5 minutes)
   ============================================================ */
const IDLE_LIMIT_MS = 5 * 60 * 1000;
const IDLE_WARN_MS  = 30 * 1000;         // warn 30s before signing out
let idleTimer = null, idleWarnTimer = null;
function clearIdleTimers(){
  if (idleTimer) clearTimeout(idleTimer);
  if (idleWarnTimer) clearTimeout(idleWarnTimer);
  idleTimer = idleWarnTimer = null;
}
function resetIdleTimer(){
  if (!SESSION) return;
  clearIdleTimers();
  idleWarnTimer = setTimeout(() => {
    toast('You will be signed out shortly due to inactivity.');
  }, IDLE_LIMIT_MS - IDLE_WARN_MS);
  idleTimer = setTimeout(async () => {
    clearIdleTimers();
    await sb.auth.signOut();
    // Reload rather than just showing the login card, so nothing from the
    // signed-in session is left rendered on screen behind it.
    location.reload();
  }, IDLE_LIMIT_MS);
}
['click','keydown','mousemove','scroll','touchstart','visibilitychange'].forEach(evt =>
  window.addEventListener(evt, () => { if (document.visibilityState !== 'hidden') resetIdleTimer(); }, { passive: true })
);

const TABS = [

  ['approvals','Approvals'], ['attendance','Attendance'], ['reports','Reports'], ['admin','Admin'],

function visibleTabs(){
  return TABS.filter(([id]) =>
      (id !== 'approvals' || IS_APPROVER)
      && (id !== 'reports' || ME.is_admin || ME.is_super_admin)
      && (id !== 'admin' || ME.is_super_admin)
      && (id !== 'attendance' || ME.is_admin || ME.is_super_admin)
      // Gap #15: a "pure" driver (no other role) gets a Trips tab; a
      // driver who's also staff doesn't need a second, narrower view of
      // the same thing they already see on Vehicles.
      && (id !== 'trips' || (ME.is_driver && !ME.is_admin && !ME.is_super_admin && !ME.can_approve))
      && (id !== 'vehicles' || !(ME.is_driver && !ME.is_admin && !ME.is_super_admin && !ME.can_approve))
      && (id !== 'assets' || !(ME.is_driver && !ME.is_admin && !ME.is_super_admin && !ME.can_approve))
      && (id !== 'leave' || !(ME.is_driver && !ME.is_admin && !ME.is_super_admin && !ME.can_approve))
      && (id !== 'compoff' || !(ME.is_driver && !ME.is_admin && !ME.is_super_admin && !ME.can_approve))
    );

function navBtn(id, label){
  return `<button data-tab="${id}" onclick="route('${id}')"><span class="ic">${ICONS[id]}</span>${t('nav_'+id) !== 'nav_'+id ? t('nav_'+id) : label}</button>`;
}
function navButtons(){
  return visibleTabs().map(([id,label]) => navBtn(id,label)).join('');
}
/* Found via a real phone, not something static analysis could catch: the
   bottom bar is a single FIXED-WIDTH row (every button flex:1, no
   scrolling) -- unlike the sidebar and drawer, which are vertical lists
   with no capacity limit. The nav grew from 5 tabs to 10 over this
   build. Cramming all 10 into one row on a phone screen squeezed several
   of them -- Assets among them -- into an unreadable sliver, which is
   exactly what looked like "Assets is missing" on mobile even though the
   permission logic was always correct and the drawer always had it.
   Fixed by keeping the bottom bar to a small, fixed number of the most-
   used tabs, with everything else reachable through a "More" button that
   opens the exact same full list that was already working in the
   drawer -- so this can't silently break again no matter how many more
   tabs get added later. */
const MOBNAV_MAX = 4;
let CURRENT_TAB = 'home';
function mobNavButtons(){
  const tabs = visibleTabs();
  if (tabs.length <= MOBNAV_MAX) return tabs.map(([id,label]) => navBtn(id,label)).join('');
  const shown = tabs.slice(0, MOBNAV_MAX);
  const rest = tabs.slice(MOBNAV_MAX);
  const restActive = rest.some(([id]) => id === CURRENT_TAB);
  const moreBtn = `<button data-tab="__more" class="${restActive?'active':''}" onclick="toggleDrawer(true)">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></span>More</button>`;
  return shown.map(([id,label]) => navBtn(id,label)).join('') + moreBtn;
}
function buildNav(){
  document.getElementById('navDesktop').innerHTML = navButtons();
  document.getElementById('navDrawer').innerHTML = navButtons();
  document.getElementById('mobnav').innerHTML = mobNavButtons();
}
function setActive(id){
  CURRENT_TAB = id;
  document.querySelectorAll('.nav button, .mobnav button[data-tab]:not([data-tab="__more"])')
    .forEach(b => b.classList.toggle('active', b.dataset.tab===id));
  // Bug fix: this always rebuilt the bottom bar, which reads ME.is_driver
  // etc via visibleTabs() -- with nothing stopping it from running before
  // sign-in ever completed (a stray popstate event on the login screen,
  // browser back/forward before enterApp() finishes, and similar timing
  // cases). ME is null at that point, and this threw "Cannot read
  // properties of null (reading 'is_driver')" -- intermittently, since
  // it depended on browser timing, not a fixed sequence.
  if (!ME) return;
  const mobHost = document.getElementById('mobnav');
  if (mobHost) mobHost.innerHTML = mobNavButtons();
}
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('on', open);

}

const TITLES = {
  home: ['Home',''], leave:['Leave','Raise and track leave'], compoff:['Comp-off','Raise and track comp-off'],
  vehicles:['Vehicles','Book and track vehicle requests'], approvals:['Approvals','Requests waiting on you'],
  assets:['Assets','Request and return field equipment'],
  attendance:['Attendance','Record and review late marks'],
  trips:['My Trips','Vehicle requests assigned to you'],
  reports:['Reports','Export as CSV, Excel or PDF'], admin:['Admin','Manage master data \u2014 superadmin only'],
};
/* Title translation reuses the same nav_* keys where they exist (Home,
   Leave, Comp-off, Vehicles, Assets, Attendance, My Trips) -- the
   subtitle stays English even in Hindi/Gujarati, since it's descriptive
   help text rather than a label someone needs to act on. */
function titleFor(id){
  const [label, sub] = TITLES[id] || [id, ''];
  const key = 'nav_'+id;
  return [t(key) !== key ? t(key) : label, sub];
}
let ROUTING = false;
async function route(id, skipHash){
  setActive(id);
  toggleDrawer(false);
  /* Gap #48: each screen gets its own #hash, so Back works, a refresh
     returns you where you were, and a screen can be bookmarked or sent
     to a colleague. */
  if (!skipHash && !ROUTING) {
    const want = '#/' + id;
    if (location.hash !== want) history.pushState({ id }, '', want);
  }
  const [title, sub] = titleFor(id);
  document.getElementById('pageTitle').innerHTML = esc(title) + (sub ? `<span>${esc(sub)}</span>` : '');
  const content = document.getElementById('content');
  content.innerHTML = '<p class="muted">Loading&hellip;</p>';
  try {
    if (id === 'home') await renderHome(content);
    else if (id === 'leave') await renderLeave(content);
    else if (id === 'compoff') await renderCompOff(content);
    else if (id === 'vehicles') await renderVehicles(content);
    else if (id === 'assets') await renderAssets(content);
    else if (id === 'approvals') await renderApprovals(content);
    else if (id === 'attendance') await renderAttendance(content);
    else if (id === 'trips') await renderMyTrips(content);
    else if (id === 'reports') await renderReports(content);
    else if (id === 'admin') await renderAdmin(content);
  } catch (e) {
    content.innerHTML = `<div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Something went wrong loading this: ${esc(e.message||e)}</div></div>`;
  }
}

/* ============================================================
   4) Small helpers
   ============================================================ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(v){
  if (!v) return '\u2014';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return v;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${+m[3]} ${months[+m[2]-1]} ${m[1]}`;
}
function pill(status){
  const key = 'st_' + String(status).replace('leave_','').replace('comp_','');
  const label = t(key) !== key ? t(key) : String(status).replace('_',' ');
  return `<span class="pill ${status}">${label}</span>`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function notice(text, kind){
  const icon = kind==='warn'
    ? '<path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/>'
    : '<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>';
  return `<div class="notice ${kind}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg><div>${esc(text)}</div></div>`;
}
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 3200);
}

/* Gap #22: show what a leave will actually cost BEFORE it's submitted --
   which days are free and why -- rather than only finding out after
   approval. Uses the same non-working-day rules as the backend. */
/* Item #3: half day can only ever cover one date. Rather than just
   validating this after the fact, the To field is disabled and kept in
   sync with From whenever half-day is checked -- so there's no way to
   end up with a half-day request spanning a range in the first place. */
function onHalfDayToggle(){
  const half = document.getElementById('lv_half').checked;
  const toInput = document.getElementById('lv_to');
  if (half) {
    toInput.value = document.getElementById('lv_from').value;
    toInput.disabled = true;
  } else {
    toInput.disabled = false;
  }
  leaveCostHint();
}
function onFromDateChange(){
  if (document.getElementById('lv_half').checked) {
    document.getElementById('lv_to').value = document.getElementById('lv_from').value;
  }
  leaveCostHint();
}
function leaveCostHint(){
  const host = document.getElementById('lv_cost');
  if (!host) return;
  const from = document.getElementById('lv_from').value;
  const to = document.getElementById('lv_to').value || from;
  const half = document.getElementById('lv_half').checked;
  if (!from || !to || to < from) { host.innerHTML = ''; return; }
  const free = [];
  const a = new Date(from+'T00:00:00Z'), b = new Date(to+'T00:00:00Z');
  let charged = 0;
  for (let d = new Date(a); d <= b; d.setUTCDate(d.getUTCDate()+1)) {
    const iso = d.toISOString().slice(0,10);
    const dow = d.getUTCDay();
    const nth = Math.ceil(d.getUTCDate()/7);
    if (HOLIDAY_SET.has(iso)) free.push([iso, t('h_holiday')]);
    else if (dow===0) free.push([iso, t('h_sunday')]);
    else if (dow===6 && (nth===1||nth===3)) free.push([iso, nth===1?t('h_sat1'):t('h_sat3')]);
    else charged++;
  }
  if (half) charged = charged ? 0.5 : 0;
  const list = free.length
    ? `<div style="margin-top:6px;font-size:12px">${t('lv_not_counted')}: ${free.map(f=>`${fmtD(f[0])} <span class="muted">(${esc(f[1])})</span>`).join(', ')}</div>`
    : '';
  host.innerHTML = `<div class="notice ${charged?'info':'ok'}" style="margin:0 0 14px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
    <div><b>${charged ? `${charged} ${t('lv_will_deduct')}` : t('lv_none_deducted')}</b>${list}

}

function onProjectChange(){
  const name = document.getElementById('vr_project').value;
  const proj = (REF.projects||[]).find(p=>p.name===name);
  const heads = proj ? (proj.project_budget_heads||[]).filter(h=>h.active) : [];
  document.getElementById('vr_head').innerHTML = heads.length
    ? heads.map(h=>`<option value="${esc(h.budget_head)}">${esc(h.budget_head)}</option>`).join('')
    : '<option value="">No budget heads found</option>';
}
function onVehicleTypeChange(){
  const external = document.getElementById('vr_vtype').value === 'external';
  document.getElementById('vr_vendorbox').style.display = external ? 'block' : 'none';
}
function addStop(){
  if (stopN >= 5) return;
  stopN++;
  const d = document.createElement('div'); d.className = 'minirow';
  d.innerHTML = `<div class="idx">${stopN}</div><input placeholder="Place name" class="snm">
    <button class="x" type="button" onclick="this.closest('.minirow').remove();reindexStops()" title="Remove">&times;</button>`;
  document.getElementById('stops').appendChild(d);
  document.getElementById('addStopBtn').disabled = stopN >= 5;
}
function reindexStops(){
  const rows = document.querySelectorAll('#stops .minirow');
  rows.forEach((r,i) => r.querySelector('.idx').textContent = i+1);
  stopN = rows.length;
  document.getElementById('addStopBtn').disabled = stopN >= 5;
}
function addTrav(){
  if (travN >= 6) return;
  travN++;
  const d = document.createElement('div'); d.className = 'travrow';
  d.innerHTML = `<div class="idx">${travN}</div><input placeholder="Traveller name" class="tnm">
    <button class="x" type="button" onclick="this.closest('.travrow').remove();reindexTravs()" title="Remove">&times;</button>`;
  document.getElementById('travs').appendChild(d);
  document.getElementById('addTravBtn').disabled = travN >= 6;
}
function reindexTravs(){
  const rows = document.querySelectorAll('#travs .travrow');
  rows.forEach((r,i) => r.querySelector('.idx').textContent = i+1);
  travN = rows.length;
  document.getElementById('addTravBtn').disabled = travN >= 6;
}
async function submitVehicleRequest(){
  const err = document.getElementById('vrMsg');
  const date = document.getElementById('vr_date').value, time = document.getElementById('vr_time').value,
        reason = document.getElementById('vr_reason').value.trim();
  if (!date || !time || !reason) { err.innerHTML = notice('Date, time, and reason are required','warn'); return; }
  const stops = [...document.querySelectorAll('#stops .snm')].map(i=>({n:i.value.trim()})).filter(s=>s.n);
  const travellers = [...document.querySelectorAll('#travs .tnm')].map(i=>i.value.trim()).filter(Boolean);
  if (!travellers.length) { err.innerHTML = notice('Add at least one traveller','warn'); return; }

  const vehicleType = document.getElementById('vr_vtype').value;
  let vendor = null;
  if (vehicleType === 'external') {
    const company = document.getElementById('vn_company').value.trim();
    if (!company) { err.innerHTML = notice('Vendor / company name is required for an external hire','warn'); return; }
    vendor = {
      company, vehicle_number: document.getElementById('vn_vehicle').value.trim(),
      driver_name: document.getElementById('vn_driver').value.trim(),
      driver_phone: document.getElementById('vn_phone').value.trim(),
      note: document.getElementById('vn_note').value.trim(),
    };
  }

  const btn = document.getElementById('vr_submit'); btn.disabled = true;
  const body = {
    project: document.getElementById('vr_project').value,
    budget_head: document.getElementById('vr_head').value,
    request_date: date, request_time: time, reason,
    night_halt: document.getElementById('vr_night').value === 'yes',
    stops, travellers, people_count: travellers.length,
    vehicle_type: vehicleType, vendor,
  };
  const r = await callFn('vehicle-request', body);
  if (r.ok) { err.innerHTML=''; toast('Raised '+r.data.display_id); notify('request_raised',{id:r.data.display_id}); renderVehicles(document.getElementById('content')); }
  else err.innerHTML = notice(r.error||'Could not raise request','warn');
  btn.disabled = false;
}

/* Gap #12: editing a vehicle request. Editing a still-pending one just
   updates it; editing one that was already approved/booked resets it to
   pending and notifies the chain again -- the old system's own rule,
   since the approval was given for details that no longer hold. */

  const { data: v } = await sb.from('vehicle_requests').select('*').eq('display_id', displayId).maybeSingle();
  if (!v) { toast('Not found'); return; }
  const willReapprove = v.status !== 'pending';
  document.getElementById('vrEditWrap').innerHTML = `
    <div class="card card-pad" style="margin-top:14px">
      <div class="pagehead"><div><h3>Edit ${esc(displayId)}</h3></div></div>
      ${willReapprove ? notice('This request was already '+v.status+'. Saving will reset it to pending and the approver will be notified again.','warn') : ''}
      <div id="vrEditMsg"></div>
      <div class="grid2">
        <div class="field"><label>Date</label><input type="date" id="vre_date" value="${v.request_date}"></div>
        <div class="field"><label>Time</label><input type="time" id="vre_time" value="${v.request_time||''}"></div>
      </div>
      <div class="field"><label style="display:flex;align-items:center;gap:7px;font-weight:500">
        <input type="checkbox" id="vre_night" ${v.night_halt?'checked':''}> Night halt</label></div>
      <div class="field"><label>Reason</label><textarea id="vre_reason">${esc(v.reason||'')}</textarea></div>
      <div class="field"><label>Travellers, comma separated</label>
        <input type="text" id="vre_travellers" value="${esc((v.travellers||[]).join(', '))}"></div>
      <div class="field"><label>Route, comma separated</label>
        <input type="text" id="vre_stops" value="${esc((v.stops||[]).map(s=>s.n).join(', '))}"></div>
      <div class="row" style="gap:8px">
        <button class="btn" onclick="submitVehicleRequestEdit('${displayId}')">Save changes</button>
        <button class="btn ghost" onclick="document.getElementById('vrEditWrap').innerHTML=''">Cancel edit</button>
      </div>
    </div>`;
}
async function submitVehicleRequestEdit(displayId){
  const travellers = document.getElementById('vre_travellers').value.split(',').map(s=>s.trim()).filter(Boolean);
  const stops = document.getElementById('vre_stops').value.split(',').map(s=>s.trim()).filter(Boolean).map(n=>({n}));
  const r = await callFn('ops-actions', {
    action:'edit_request', display_id:displayId,
    request_date: document.getElementById('vre_date').value,
    request_time: document.getElementById('vre_time').value || null,
    night_halt: document.getElementById('vre_night').checked,
    reason: document.getElementById('vre_reason').value || null,
    travellers, stops,
  });
  const el = document.getElementById('vrEditMsg');
  if (r.ok) {
    toast('Updated ' + displayId);
    if (r.data.needs_reapproval) notify('request_edited', { id: displayId });
    document.getElementById('vrEditWrap').innerHTML='';
    loadMyVehicleRequests();
  } else el.innerHTML = notice(r.error||'Could not save','warn');
}

/* Gap #13: 'cancelled' was a valid status nothing could ever set. */
async function cancelRequest(displayId){
  if (!confirm(`Cancel ${displayId}? This can't be undone.`)) return;
  const r = await callFn('ops-actions', { action:'cancel_request', display_id:displayId });
  if (!r.ok) { toast(r.error||'Could not cancel'); return; }
  toast('Cancelled ' + displayId);
  loadMyVehicleRequests();
}

/* Gap #9: WhatsApp hand-off to the driver, in the language the admin
   picks per message -- ported from the old system, including the fix
   that the message language must not follow the app's display language. */
const WA_MONTHS = {
  en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  hi:['\u091c\u0928','\u092b\u093c\u0930','\u092e\u093e\u0930\u094d\u091a','\u0905\u092a\u094d\u0930\u0948\u0932','\u092e\u0908','\u091c\u0942\u0928','\u091c\u0941\u0932','\u0905\u0917','\u0938\u093f\u0924','\u0905\u0915\u094d\u0924\u0942','\u0928\u0935','\u0926\u093f\u0938'],
  gu:['\u0a9c\u0abe\u0aa8\u0acd\u0aaf\u0ac1','\u0aab\u0ac7\u0aac\u0acd\u0ab0\u0ac1','\u0aae\u0abe\u0ab0\u0acd\u0a9a','\u0a8f\u0aaa\u0acd\u0ab0\u0abf\u0ab2','\u0aae\u0ac7','\u0a9c\u0ac2\u0aa8','\u0a9c\u0ac1\u0ab2\u0abe','\u0a91\u0a97','\u0ab8\u0aaa\u0acd\u0a9f\u0ac7','\u0a91\u0a95\u0acd\u0a9f\u0acb','\u0aa8\u0ab5\u0ac7','\u0aa1\u0abf\u0ab8\u0ac7'],
};
function waDate(v, lang){
  const m = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(v||'');
  const months = WA_MONTHS[lang] || WA_MONTHS.en;
  return `${+m[3]} ${months[+m[2]-1]} ${m[1]}`;
}
function waText(v, lang){
  const L = WA_MONTHS[lang] ? lang : 'en';
  const route = (v.stops||[]).map(s=>s.n).filter(Boolean).join(' \u2192 ') || '\u2014';
  const people = (v.travellers||[]).filter(Boolean).join(', ') || '\u2014';
  const date = waDate(v.request_date, L), time = v.request_time || '\u2014';
  const halt = { en:['Yes','No'], hi:['\u0939\u093e\u0901','\u0928\u0939\u0940\u0902'], gu:['\u0ab9\u0abe','\u0aa8\u0abe'] }[L][v.night_halt?0:1];
  const T = {
    en:`Trip ${v.display_id} confirmed.\n\nDate: ${date} at ${time}\nVehicle: ${v.vehicle_number||'\u2014'}\nRoute: ${route}\nFor: ${v.by_name||'\u2014'}\nTravelling: ${people}\nNight halt: ${halt}\n\nPlease note the odometer reading before you leave, and enter it in the app when you start the trip.`,
    hi:`\u091f\u094d\u0930\u093f\u092a ${v.display_id} \u0915\u0928\u094d\u092b\u0930\u094d\u092e \u0939\u094b \u0917\u0908 \u0939\u0948\u0964\n\n\u0924\u093e\u0930\u0940\u0916: ${date}, \u0938\u092e\u092f ${time}\n\u0935\u093e\u0939\u0928: ${v.vehicle_number||'\u2014'}\n\u092e\u093e\u0930\u094d\u0917: ${route}\n\u0915\u0947 \u0932\u093f\u090f: ${v.by_name||'\u2014'}\n\u092f\u093e\u0924\u094d\u0930\u0940: ${people}\n\u0930\u093e\u0924\u094d\u0930\u093f \u0920\u0939\u0930\u093e\u0935: ${halt}\n\n\u0928\u093f\u0915\u0932\u0928\u0947 \u0938\u0947 \u092a\u0939\u0932\u0947 \u092e\u0940\u091f\u0930 \u0930\u0940\u0921\u093f\u0902\u0917 \u0928\u094b\u091f \u0915\u0930\u0947\u0902\u0964`,
    gu:`\u0a9f\u0acd\u0ab0\u0abf\u0aaa ${v.display_id} \u0a95\u0aa8\u0acd\u0aab\u0ab0\u0acd\u0aae \u0aa5\u0a88 \u0a9b\u0ac7.\n\n\u0aa4\u0abe\u0ab0\u0ac0\u0a96: ${date}, \u0ab8\u0aae\u0aaf ${time}\n\u0ab5\u0abe\u0ab9\u0aa8: ${v.vehicle_number||'\u2014'}\n\u0aae\u0abe\u0ab0\u0acd\u0a97: ${route}\n\u0aae\u0abe\u0a9f\u0ac7: ${v.by_name||'\u2014'}\n\u0aae\u0ac1\u0ab8\u0abe\u0aab\u0ab0\u0acb: ${people}\n\u0ab0\u0abe\u0aa4\u0acd\u0ab0\u0abf \u0ab0\u0acb\u0a95\u0abe\u0aa3: ${halt}\n\n\u0aa8\u0ac0\u0a95\u0ab3\u0aa4\u0abe \u0aaa\u0ab9\u0ac7\u0ab2\u0abe\u0a82 \u0aae\u0ac0\u0a9f\u0ab0 \u0ab0\u0ac0\u0aa1\u0abf\u0a82\u0a97 \u0aa8\u0acb\u0a82\u0aa7\u0acb.`,
  };
  return T[L] || T.en;
}
function normPhone(p){
  const d = String(p||'').replace(/\D/g,'');
  if (!d) return '';
  return d.length === 10 ? '91'+d : d;
}
async function sendWhatsApp(displayId, selectId){
  const { data: v } = await sb.from('vehicle_requests').select('*').eq('display_id', displayId).maybeSingle();
  if (!v) { toast('Request not found'); return; }
  const phone = normPhone(v.driver_phone);
  if (!phone) { toast('No phone number on file for this driver'); return; }
  const sel = document.getElementById(selectId);
  const lang = sel ? sel.value : 'en';
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(waText(v, lang))}`, '_blank', 'noopener');
}

let NEGATIVE_BALANCE_CACHE = [];
async function loadNegativeBalances(){
  const host = document.getElementById('apNegative');
  const r = await callFn('negative-balance-report', {});
  if (!r.ok) { host.innerHTML = notice(r.error||'Could not load','warn'); return; }
  NEGATIVE_BALANCE_CACHE = r.data.people;
  if (!r.data.people.length) { host.innerHTML = '<div class="empty">Nobody is negative this quarter.</div>'; return; }
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Used this quarter</th><th>Remaining</th></tr></thead><tbody>
    ${r.data.people.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.casual_used}</td><td style="color:var(--madder);font-weight:700">${p.casual_remaining}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function exportNegativeBalances(){
  if (!NEGATIVE_BALANCE_CACHE.length) { toast('Nothing to export'); return; }
  const rows = [['Name','Email','Used this quarter','Remaining'],
    ...NEGATIVE_BALANCE_CACHE.map(p=>[p.name, p.email, p.casual_used, p.casual_remaining])];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `negative-leave-balances-${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Gap #17: the old system checked plausibility BEFORE saving, not only
   after. Fetches the vehicle's last known reading and asks for explicit
   confirmation if it doesn't match, rather than silently saving and
   flagging it afterward -- the backend still flags it either way, this
   just gives a chance to catch a typo before it's on record. */
async function startTrip(id, reqNo){
  const vehicleNum = document.getElementById('start_km_'+reqNo).dataset.vehicle;
  const startKm = Number(document.getElementById('start_km_'+reqNo).value);
  if (!Number.isFinite(startKm) || startKm < 0) { toast('Enter a valid odometer reading'); return; }
  if (vehicleNum) {
    const { data: totals } = await sb.from('vehicle_totals').select('last_odometer').eq('vehicle_number', vehicleNum).maybeSingle();
    if (totals && totals.last_odometer !== null && Number(totals.last_odometer) !== startKm) {
      const diff = startKm - Number(totals.last_odometer);
      const proceed = confirm(
        `This vehicle's last recorded reading was ${totals.last_odometer} km. `+
        `You entered ${startKm} km (${diff>0?'+':''}${diff} km).\n\nContinue anyway?`
      );
      if (!proceed) return;
    }
  }
  const body = { display_id:id, start_km:startKm };
  const r = await callFn('vehicle-start', body);
  if (!r.ok) toast(r.error||'Could not start trip');
  else {
    toast('Trip started'); notify('trip_started',{id});
    if (r.data && r.data.flagged) {
      notify('odo_gap', { id, vehicle:r.data.vehicle_number, now:r.data.start_km,
        prev:r.data.previous_odometer, gap:r.data.gap, large:r.data.large });
      toast(r.data.large ? 'Large odometer gap flagged for review' : 'Odometer gap flagged');
    }
  }
  loadAdminVehicleActions();
}
/* Gap #11: a multi-day field trip logs each day's leg separately. */
async function logTripDay(id, reqNo){
  const r = await callFn('ops-actions', {
    action:'log_trip_day', display_id:id,
    day_no: Number(document.getElementById('td_day_'+reqNo).value),
    trip_date: document.getElementById('td_date_'+reqNo).value || null,
    start_km: Number(document.getElementById('td_start_'+reqNo).value),
    end_km: Number(document.getElementById('td_end_'+reqNo).value),
  });
  if (!r.ok) { toast(r.error||'Could not log that day'); return; }
  toast(`Day ${r.data.day_no} logged (${r.data.km} km)`);
}
async function closeTrip(id, reqNo){
  const startKm = Number(document.getElementById('close_start_'+reqNo)?.dataset.startKm || 0);
  const endKm = Number(document.getElementById('end_km_'+reqNo).value);
  if (!Number.isFinite(endKm) || endKm < startKm) { toast('End reading must be at or above the start reading'); return; }
  if (startKm && (endKm - startKm) > 500) {
    if (!confirm(`This trip would be ${endKm-startKm} km \u2014 unusually long. Continue anyway?`)) return;
  }
  const body = { display_id:id, end_km:endKm };
  const r = await callFn('vehicle-close', body);
  if (!r.ok) toast(r.error||'Could not close trip'); else { toast('Trip closed'); notify('trip_ended',{id}); } loadAdminVehicleActions();
}

async function renderAssets(main){
  const isAdmin = ME.is_admin || ME.is_super_admin;
  const [{ data: items }, { data: held }] = await Promise.all([
    sb.from('asset_items').select('*').eq('active', true).order('category'),
    // Bug fix: this used to include 'requested' -- a merely-requested item
    // (still pending admin validation, nothing handed over yet) was
    // wrongly blocking everyone else from even trying. Only an item
    // that's ACTUALLY out -- issued or overdue -- should block a new
    // request; several pending requests for the same item can coexist
    // until an admin validates one.
    sb.from('assets').select('asset_item_id, by_name, issue_date, due_date, status').in('status', ['issued','overdue']),
  ]);
  const heldBy = {};
  (held||[]).forEach(h => { heldBy[h.asset_item_id] = h; });

  const byCat = {};
  (items||[]).forEach(i => { (byCat[i.category] ??= []).push(i); });
  const itemOpts = Object.keys(byCat).sort().map(cat =>
    `<optgroup label="${esc(cat)}">${byCat[cat].map(i=>{
      const h = heldBy[i.id];
      return `<option value="${i.id}" ${h?'disabled':''}>${esc(i.item)}${h?` \u2014 held by ${esc(h.by_name)}, due ${fmtD(h.due_date)}`:''}</option>`;
    }).join('')}</optgroup>`
  ).join('');
  const unavailableRows = Object.entries(heldBy).map(([itemId, h]) => {
    const item = (items||[]).find(i => String(i.id)===String(itemId));
    return { item: item?.item || '\u2014', ...h };
  });
  // Default due date: two weeks out, which is a sane starting point
  // rather than forcing everyone to pick a date from scratch.
  const due = new Date(); due.setDate(due.getDate()+14);
  const maxDue = new Date(); maxDue.setDate(maxDue.getDate()+14);

  main.innerHTML = `
    <div class="card card-pad" style="margin-bottom:18px">
      <div class="pagehead"><div><h3>${t('as_request')}</h3></div></div>
      <div id="asMsg"></div>
      <div class="grid2">

          <select id="as_item"><option value="">Select&hellip;</option>${itemOpts}</select></div>
        <div class="field"><label>${t('as_due')} <span class="req">*</span></label>
          <input type="date" id="as_due" value="${due.toISOString().slice(0,10)}" min="${todayISO()}" max="${maxDue.toISOString().slice(0,10)}"></div>
      </div>
      <button class="btn" id="as_submit" onclick="submitAssetRequest()">${t('as_submit')}</button>
    </div>
    ${unavailableRows.length ? `
    <div class="card card-pad" style="margin-bottom:18px">
      <div class="pagehead"><div><h3>Currently unavailable</h3><p>Held by someone else right now \u2014 request again once it's returned</p></div></div>
      ${unavailableRows.map(r=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="font-weight:700;margin-bottom:3px">${esc(r.item)}${r.status==='overdue'?' <span class="pill overdue" style="margin-left:4px">overdue</span>':''}</div>
          <div style="font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 14px">
            <span><b style="color:var(--ink)">Held by</b> ${esc(r.by_name)}</span>
            <span><b style="color:var(--ink)">Issued</b> ${fmtD(r.issue_date)}</span>
            <span><b style="color:var(--ink)">Due back</b> ${fmtD(r.due_date)}</span>
          </div>
        </div>`).join('')}
    </div>` : ''}
    <div class="pagehead"><div><h3>${t('as_mine')}</h3></div></div>
    <div id="myAssets" style="margin-bottom:20px"><p class="muted">${t('loading')}</p></div>
    ${isAdmin ? `
    <div class="card card-pad" style="margin-bottom:18px">
      <div class="pagehead"><div><h3>Lend to an external person</h3><p>Issued directly, no request/validation step \u2014 the admin lending it in person is the validation</p></div></div>
      <div id="extMsg"></div>
      <div class="grid2">
        <div class="field"><label>Item <span class="req">*</span></label>
          <select id="ext_item"><option value="">Select&hellip;</option>${itemOpts}</select></div>
        <div class="field"><label>Return by <span class="req">*</span></label>
          <input type="date" id="ext_due" value="${due.toISOString().slice(0,10)}" min="${todayISO()}" max="${maxDue.toISOString().slice(0,10)}"></div>
        <div class="field"><label>Their name <span class="req">*</span></label><input type="text" id="ext_name"></div>
        <div class="field"><label>Their email <span class="req">*</span></label><input type="text" id="ext_email" placeholder="name@example.org"></div>
      </div>
      <div class="field"><label>Note (optional)</label><input type="text" id="ext_note" placeholder="e.g. partner org, purpose"></div>
      <button class="btn" id="ext_submit" onclick="submitExternalLend()">Lend item</button>
      <p class="subtle-note">They'll get the same "asset issued" and overdue emails a staff member would \u2014 sent to the email entered above.</p>
    </div>` : ''}
    ${isAdmin ? `<div class="pagehead"><div><h3>All equipment out</h3><p>Validate issues and confirm returns</p></div><span class="sp"></span>
      <button class="btn ghost sm" onclick="sweepOverdue()">Run overdue check</button></div>
      <div id="allAssets"><p class="muted">${t('loading')}</p></div>` : ''}
  `;
  loadMyAssets();
  if (isAdmin) loadAllAssets();
}
async function submitExternalLend(){
  const el = document.getElementById('extMsg');
  const itemId = document.getElementById('ext_item').value;
  const dueDate = document.getElementById('ext_due').value;
  const name = document.getElementById('ext_name').value.trim();
  const emailVal = document.getElementById('ext_email').value.trim();
  if (!itemId) { el.innerHTML = notice('Pick an item','warn'); return; }
  if (!dueDate) { el.innerHTML = notice('Pick a return date','warn'); return; }
  if (!name) { el.innerHTML = notice("Enter the person's name",'warn'); return; }
  if (!emailVal) { el.innerHTML = notice("Enter the person's email",'warn'); return; }
  const btn = document.getElementById('ext_submit'); btn.disabled = true;
  const r = await callFn('asset-actions', {
    action:'lend_external', asset_item_id:Number(itemId), due_date:dueDate,
    external_name:name, external_email:emailVal, note:document.getElementById('ext_note').value.trim()||null,
  });
  if (r.ok) {
    el.innerHTML='';
    toast('Lent '+r.data.display_id);
    notify('asset_issued', { id: r.data.display_id });
    renderAssets(document.getElementById('content'));

async function assetAction(action, displayId){
  const r = await callFn('asset-actions', { action, display_id: displayId });
  if (!r.ok) { toast(r.error||'Could not do that'); return; }
  toast(action==='confirm_return' ? 'Return confirmed' : action==='issue' ? 'Issue validated'
    : action==='reject_request' ? 'Request rejected' : 'Marked for return');
  if (action==='issue') notify('asset_issued',{id:displayId});
  if (action==='confirm_return') notify('asset_returned',{id:displayId});

/* ============================================================
   11) Reports -- CSV, Excel, and PDF export
   ============================================================ */
/* Every export carries the same two stamps: WHO generated it (email, not
   just display name -- an email is unambiguous, a name isn't) and exactly
   WHEN. Built once here so CSV, Excel and PDF can't drift apart. */
function reportStamps(){
  const now = new Date();
  return {
    by: ME.email,
    byName: ME.name,
    // Local, human-readable for the PDF header...
    localStamp: now.toLocaleString(),
    // ...plus a precise ISO timestamp, which is unambiguous across
    // timezones and sorts correctly if these files are ever collated.
    isoStamp: now.toISOString(),
  };
}
function stampRows(){
  const s = reportStamps();
  return [
    [], // blank spacer row so the stamps read as a footer, not more data
    ['Generated by', s.by],
    ['Generated at (local)', s.localStamp],
    ['Generated at (UTC/ISO)', s.isoStamp],
  ];
}
function downloadCSV(filename, headers, rows){
  const all = [headers, ...rows, ...stampRows()];
  const csv = all.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function downloadExcel(filename, headers, rows){
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows, ...stampRows()]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  XLSX.writeFile(wb, filename);
}
/* Gap #38: work out which columns are numeric from the data itself, so
   every report gets sensible alignment without each one declaring types. */
function numericCols(headers, rows){
  return headers.map((_,i) => {
    let seen = 0;
    for (const r of rows) {
      const v = r[i];
      if (v === null || v === undefined || String(v).trim() === '') continue;
      seen++;
      if (!/^-?[\d,]+(\.\d+)?$/.test(String(v).trim().replace(/^\u20b9/,''))) return false;
      if (seen >= 40) break;
    }
    return seen > 0;
  });
}
/* Gap #37: orientation is a real @page rule, which a CSS class can't
   switch -- it has to be injected. Anything past 6 columns is unreadable
   squeezed into portrait. */
function setPrintOrientation(landscape){
  let el = document.getElementById('printOrientation');
  if (!el) { el = document.createElement('style'); el.id = 'printOrientation'; document.head.appendChild(el); }
  el.textContent = `@page{size:A4 ${landscape?'landscape':'portrait'};margin:${landscape?'8mm':'12mm'}}`;
}
function printReport(title, headers, rows){
  const s = reportStamps();
  const wide = headers.length > 6;
  const nums = numericCols(headers, rows);
  setPrintOrientation(wide);
  document.getElementById('printArea').innerHTML = `<div class="slip${wide?' wide':''}">
    <h2>${esc(title)}</h2>
    <div class="grid">
      <div><b>Generated by</b>${esc(s.byName)} (${esc(s.by)})</div>
      <div><b>Generated at</b>${esc(s.localStamp)}</div>
      <div><b>Timestamp (ISO)</b>${esc(s.isoStamp)}</div>
      <div><b>Records</b>${rows.length}</div>
    </div>
    <table><thead><tr>${headers.map((h,i)=>`<th class="${nums[i]?'num':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${nums[i]?'num':''}">${esc(v)}</td>`).join('')}</tr>`).join('')}
    </tbody></table>
    <p style="margin-top:14px;font-size:11px">Generated by ${esc(s.by)} at ${esc(s.localStamp)} \u00b7 ${esc(s.isoStamp)}</p>
  </div>`;
  window.print();
}

/* On-screen leave register, matching the old system's leaveTrackerTab():
   filterable by date range, person and status, showing calendar days vs

let LEAVE_REGISTER_ROWS = [];
async function loadLeaveRegister(){
  const host = document.getElementById('lrTable');
  if (!host) return;
  const from = document.getElementById('lr_from').value;
  const to = document.getElementById('lr_to').value;
  const person = document.getElementById('lr_person').value;
  const status = document.getElementById('lr_status').value;

  let q = sb.from('leaves').select('*').order('from_date', { ascending:false });
  if (person) q = q.eq('by_email', person);
  if (status) q = q.eq('status', status);
  const { data, error } = await q;
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }

  // Date range matched on the leave dates themselves (not when it was
  // applied for), same as the old system did.
  const rows = (data||[]).filter(x => {
    const a = String(x.from_date||'').slice(0,10);
    const b = String(x.to_date||x.from_date||'').slice(0,10);
    if (!a) return false;
    if (from && b && b < from) return false;
    if (to && a > to) return false;
    return true;
  });
  LEAVE_REGISTER_ROWS = rows;

  if (!rows.length) { host.innerHTML = '<div class="empty">No leave in this range.</div>'; return; }
  const totalDeducted = rows.reduce((n,x)=>n+(Number(chargeableFor(x))||0),0);
  host.innerHTML = `<div class="tablewrap"><table><thead><tr>
      <th>ID</th><th>Staff</th><th>Type</th><th>From</th><th>To</th>
      <th>Calendar days</th><th>Not counted</th><th>Days deducted</th><th>Status</th><th>Decided by</th></tr></thead><tbody>
    ${rows.map(x=>{
      const cal = calendarDaysBetween(x.from_date, x.to_date);
      const charged = chargeableFor(x);
      return `<tr><td><b>${esc(x.display_id)}</b></td><td>${esc(x.by_name)}</td><td>${esc(x.leave_type)}</td>
        <td>${fmtD(x.from_date)}</td><td>${fmtD(x.to_date)}</td>
        <td>${cal}</td><td>${cal-charged||''}</td><td><b>${charged}</b></td>
        <td>${pill(x.status)}</td><td>${esc(x.decided_by||'\u2014')}</td></tr>`;
    }).join('')}
  </tbody><tfoot><tr><td colspan="7"><b>Total days deducted</b></td><td><b>${totalDeducted}</b></td><td colspan="2"></td></tr></tfoot></table></div>`;
}
/* Mirrors the backend's non-working-day rules so the on-screen register
   agrees with what leave-balance actually deducts. */
function calendarDaysBetween(from, to){
  const a = new Date(String(from).slice(0,10)+'T00:00:00Z');
  const b = new Date(String(to||from).slice(0,10)+'T00:00:00Z');
  if (isNaN(a)||isNaN(b)||b<a) return 0;
  return Math.round((b-a)/86400000)+1;
}
function chargeableFor(x){
  const a = new Date(String(x.from_date).slice(0,10)+'T00:00:00Z');
  const b = new Date(String(x.to_date||x.from_date).slice(0,10)+'T00:00:00Z');
  if (isNaN(a)||isNaN(b)||b<a) return 0;
  let n = 0;
  for (let d = new Date(a); d <= b; d.setUTCDate(d.getUTCDate()+1)) {
    const s = d.toISOString().slice(0,10);
    if (HOLIDAY_SET.has(s)) continue;
    const dow = d.getUTCDay();
    if (dow === 0) continue;
    if (dow === 6) { const nth = Math.ceil(d.getUTCDate()/7); if (nth===1||nth===3) continue; }
    n++;
  }
  // Bug fix: half_day was never checked here, even though the backend's
  // own version of this same calculation (leave-balance) has always
  // halved it. A half-day leave was showing as a full day everywhere
  // this function is used -- here, and in the leave register report.
  if (x.half_day) return n > 0 ? 0.5 : 0;
  return n;
}

/* Shared toggle for the simple active/retired switches above. */
async function adminToggleSimple(action, keyField, keyValue, value, refresh){
  const body = {}; body[keyField] = keyValue; body.active = value;

  if (ok && refresh) refresh();

/* Tabular view of the leave-approval matrix. Two things a dropdown pair
   can never show: the whole mapping at a glance, and -- more usefully --
   who has NOBODY assigned, which is exactly the case that makes
   leave-request fail with "no approver set up". Those rows are flagged
   rather than silently absent. */
async function renderLeaveApproverTable(){
  const host = document.getElementById('laTable');
  if (!host) return;
  const [{ data: pairs }, { data: users }] = await Promise.all([
    sb.from('leave_approvers').select('staff_email, approver_email'),
    sb.from('users').select('email, name, active').order('name'),
  ]);
  const byStaff = {};
  (pairs||[]).forEach(p => byStaff[String(p.staff_email).toLowerCase()] = String(p.approver_email).toLowerCase());
  const nameOf = {};
  (users||[]).forEach(u => nameOf[String(u.email).toLowerCase()] = u.name);
  const rows = (users||[]).filter(u => u.active !== false);
  if (!rows.length) { host.innerHTML = '<div class="empty">No users yet.</div>'; return; }
  const missing = rows.filter(u => !byStaff[String(u.email).toLowerCase()]).length;
  host.innerHTML =
    (missing ? notice(`${missing} person(s) have no leave approver assigned \u2014 they can't raise leave until one is set.`,'warn') : '') +
    `<div class="tablewrap"><table><thead><tr><th>Staff member</th><th>Approves their leave</th></tr></thead><tbody>
      ${rows.map(u=>{
        const appr = byStaff[String(u.email).toLowerCase()];
        return `<tr><td>${esc(u.name)}<div class="muted" style="font-size:11.5px">${esc(u.email)}</div></td>
          <td>${appr
            ? esc(nameOf[appr] || appr) + `<div class="muted" style="font-size:11.5px">${esc(appr)}</div>`
            : '<span class="pill leave_rejected">not set</span>'}</td></tr>`;
      }).join('')}
    </tbody></table></div>`;
}

/* Same idea for vehicle approvals: the whole per-project chain at a
   glance, including projects with no chain at all (which is what makes a
   vehicle request fail on submission). */
async function renderProjectChainTable(){
  const host = document.getElementById('pcTable');
  if (!host) return;
  const [{ data: chains }, { data: projects }, { data: users }] = await Promise.all([
    sb.from('project_approval_chains').select('project_id, layer1, layer2'),
    sb.from('projects').select('id, name').order('name'),
    sb.from('users').select('email, name'),
  ]);
  const nameOf = {};
  (users||[]).forEach(u => nameOf[String(u.email).toLowerCase()] = u.name);
  const byProject = {};
  (chains||[]).forEach(c => byProject[c.project_id] = c);
  const rows = projects||[];
  if (!rows.length) { host.innerHTML = '<div class="empty">No projects yet.</div>'; return; }
  const missing = rows.filter(p => !byProject[p.id]?.layer1).length;
  const cell = (e) => e
    ? esc(nameOf[String(e).toLowerCase()] || e) + `<div class="muted" style="font-size:11.5px">${esc(e)}</div>`
    : '<span class="muted">\u2014</span>';
  host.innerHTML =
    (missing ? notice(`${missing} project(s) have no layer-1 approver \u2014 vehicle requests under them can't be raised.`,'warn') : '') +
    `<div class="tablewrap"><table><thead><tr><th>Project</th><th>Layer 1</th><th>Layer 2 (escalation)</th></tr></thead><tbody>
      ${rows.map(p=>{
        const c = byProject[p.id] || {};
        return `<tr><td><b>${esc(p.name)}</b></td><td>${c.layer1?cell(c.layer1):'<span class="pill leave_rejected">not set</span>'}</td><td>${cell(c.layer2)}</td></tr>`;
      }).join('')}
    </tbody></table></div>`;
}
async function renderLateMarkMatrix(){
  const host = document.getElementById('lmMatrix');
  const { data, error } = await sb.from('late_marks').select('staff_email, staff_name, late_date').order('late_date', { ascending:false });
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">No late marks recorded yet.</div>'; return; }
  const byPerson = {};
  data.forEach(r => {
    const key = r.staff_email;
    if (!byPerson[key]) byPerson[key] = { name: r.staff_name, count: 0, last: r.late_date };
    byPerson[key].count++;
    if (r.late_date > byPerson[key].last) byPerson[key].last = r.late_date;
  });
  const rows = Object.values(byPerson).sort((a,b) => b.count - a.count);
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Late marks</th><th>Most recent</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.count}</td><td>${fmtD(r.last)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
async function adminRecordLateMark(){
  const el = document.getElementById('lmMsg');
  const staff = val('lm_staff');
  // Gap #26: the old system recorded several dates in one go; the extra
  // lines are optional, so the single-date case is unchanged.
  const extra = document.getElementById('lm_more').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const dates = [val('lm_date'), ...extra].filter(Boolean);
  const bad = dates.filter(d => !/^\d{4}-\d{2}-\d{2}$/.test(d));
  if (bad.length) { el.innerHTML = notice('These dates look wrong: '+bad.join(', '),'warn'); return; }
  if (!dates.length) { el.innerHTML = notice('Pick at least one date','warn'); return; }
  const r = await callFn('ops-actions', { action:'record_late_marks', staff_email:staff, dates, note: val('lm_note')||null });
  if (r.ok) {
    el.innerHTML='';
    toast(`Recorded ${dates.length} late mark(s)`);
    notify('late_recorded',{staff_email:staff, dates});
    document.getElementById('lm_note').value='';
    document.getElementById('lm_more').value='';
    renderLateMarkMatrix();
  } else el.innerHTML = notice(r.error||'Could not record','warn');
}

/* ============================================================
   10) Boot
   ============================================================ */
/* Gap #48: Back/forward move between screens instead of leaving the app.
   Guarded against firing before sign-in completes (this was the actual
   trigger of the ME.is_driver crash -- browsers can fire popstate at
   unpredictable times, including while still on the login screen). */
window.addEventListener('popstate', e => {
  if (!ME) return;
  const id = (e.state && e.state.id) || (location.hash || '').replace('#/','') || 'home';
  ROUTING = true;
  route(id, true).finally(() => { ROUTING = false; });
});

/* Gap #8: register the service worker so the app installs to a phone's
   home screen and opens without a connection. Failing to register is
   never fatal -- the app just behaves as before. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

(async () => {
  setLang(LANG);   // paints the login screen's text and active button before we even know if there's a session
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
  if (session) enterApp(); else showLogin();
})();
