<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahjeevan Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   SAHJEEVAN OPERATIONS — stylesheet
   ------------------------------------------------------------
   NOTE: index.html carries these same styles inline and does NOT
   link this file. The app is deliberately one self-contained
   file so it can be opened from anywhere, including offline.

   This copy is kept in sync for reference, or if you ever want to
   split the CSS out. To use it, add to <head>:
       <link rel="stylesheet" href="styles.css">
   and delete the <style> block from index.html. Keeping BOTH will
   not break anything, but you would then have to edit two files
   for every change.

   Palette grounded in Kachchh/Banni: Ajrakh indigo, grassland
   green, salt/sand neutrals, madder red used sparingly.
   ============================================================ */

:root{
  --indigo:#1d2b50;--indigo-700:#2a3d6e;--indigo-500:#3c558f;
  --grass:#4f7d3f;--grass-soft:#e8f0e2;
  --madder:#a23b24;--madder-soft:#f6e6e0;
  --amber:#c8861a;--amber-soft:#f8eed8;
  --sand:#f3efe6;--bone:#fbf9f4;
  --ink:#222630;--ink-soft:#5a6072;
  --line:#e2ddd0;--line-strong:#cfc8b6;--white:#ffffff;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(29,43,80,.06),0 8px 24px rgba(29,43,80,.06);
  --shadow-lg:0 12px 40px rgba(29,43,80,.16);
  --font:"Hanken Grotesk","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
:lang(hi),:lang(gu){font-weight:400}
button{font-family:inherit;cursor:pointer}
a{color:var(--indigo-500)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--bone);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);max-width:440px;width:100%;overflow:hidden}
.login-head{background:var(--indigo);color:#fff;padding:30px 30px 26px;position:relative}
.login-head .mark{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.login-head .mark .glyph{width:58px;height:58px;flex:none}
.login-head h1{font-size:21px;letter-spacing:-.02em}
.login-head p{margin:4px 0 0;color:#b9c4dd;font-size:13.5px}
.weave{height:8px;background:repeating-linear-gradient(135deg,var(--grass) 0 9px,var(--amber) 9px 18px,var(--madder) 18px 27px,var(--indigo-500) 27px 36px)}
.login-body{padding:24px 30px 30px}
.login-body label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.login-hint{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.login-status{margin-top:16px;font-size:13px;line-height:1.5;text-align:center}
.login-status.err{color:var(--madder)}
.login-status.busy{color:var(--ink-soft)}
.login-setup{margin-top:16px;font-size:12.5px;color:var(--ink-soft);background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:10px;padding:12px 13px;line-height:1.55;text-align:left}
.login-setup b{color:var(--ink)}
.login-setup code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}


.app{display:none;min-height:calc(100vh - 33px)}
.app.on{display:grid;grid-template-columns:230px 1fr}
.sidebar{background:var(--indigo);color:#cdd6ea;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 33px)}
.brand{padding:16px 16px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .glyph{width:46px;height:46px;flex:none}
/* The logo is a dark-brown wordmark, so it needs a light tile to sit on
   against the indigo chrome. */
.glyph.has-logo{background:#fff;border-radius:9px;padding:4px;box-sizing:border-box;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}
.login-head .mark .glyph.has-logo{border-radius:11px;padding:5px}
.brand b{color:#fff;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:#8c9bc0;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav .grp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6f7ea6;padding:12px 12px 5px}
.nav button{background:transparent;border:0;color:#cdd6ea;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:11px;width:100%;transition:background .12s,color .12s}
.nav button .ic{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--bone);color:var(--indigo);font-weight:700}
.nav button.active .ic{opacity:1}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .who{font-size:13px;color:#fff;font-weight:600}
.side-foot .who small{display:block;color:#8c9bc0;font-weight:500;font-size:11.5px}
.side-foot button{margin-top:9px;width:100%;background:rgba(255,255,255,.08);border:0;color:#dfe6f5;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600}
.side-foot button:hover{background:rgba(255,255,255,.16)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--bone);border-bottom:1px solid var(--line);padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:17px;flex:1;min-width:0}
.topbar h2 span{display:block;font-size:12px;color:var(--ink-soft);font-weight:500}
.lang{display:flex;background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.lang button.on{background:var(--indigo);color:#fff}
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto}

.mobnav{display:none}.hamb{display:none}

.card{background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.field .req{color:var(--madder)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:9px;padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo-500);box-shadow:0 0 0 3px rgba(60,85,143,.14)}
textarea{resize:vertical;min-height:64px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;background:var(--indigo);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,filter .12s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--indigo);border:1px solid var(--line-strong)}
.btn.grass{background:var(--grass)}.btn.madder{background:var(--madder)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pagehead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h3{font-size:19px}
.pagehead p{margin:3px 0 0;color:var(--ink-soft);font-size:13.5px}
.pagehead .sp{flex:1}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:#eceae3;color:#7a7565}
.pill.pending{background:var(--amber-soft);color:#9a6712}
.pill.approved{background:var(--grass-soft);color:#3a5e2e}
.pill.rejected{background:var(--madder-soft);color:#82301c}
.pill.booked{background:#e2e9f7;color:#2a3d6e}
.pill.progress{background:#e0eef0;color:#1c6470}
.pill.completed{background:#e7e4ee;color:#4b3d6e}
.pill.issued{background:var(--amber-soft);color:#9a6712}
.pill.returned{background:var(--grass-soft);color:#3a5e2e}
.pill.overdue{background:var(--madder-soft);color:#82301c}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--bone)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line);background:#f7f4ec}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:#faf8f2}
.muted{color:var(--ink-soft)}
.kvs{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.kvs div{display:flex;gap:8px}
.kvs span{color:var(--ink-soft);min-width:140px;font-weight:600;font-size:12.5px}

.stat{display:flex;flex-direction:column;gap:2px;background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink-soft);font-weight:600}
.stat.g .n{color:var(--grass)}.stat.a .n{color:var(--amber)}.stat.i .n{color:var(--indigo)}.stat.m .n{color:var(--madder)}

.notice{border-radius:var(--radius);padding:13px 15px;font-size:13.5px;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.info{background:#e9eefb;color:#2a3d6e;border:1px solid #cdd9f3}
.notice.warn{background:var(--amber-soft);color:#7d5510;border:1px solid #ecd9a8}
.notice.privacy{background:var(--grass-soft);color:#33502a;border:1px solid #c6dcb8}

.minirow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.minirow .idx{width:26px;height:26px;border-radius:7px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.minirow .x{background:#fff;border:1px solid var(--line-strong);color:var(--madder);border-radius:8px;padding:0;width:34px;height:38px;font-size:18px;line-height:1}
.travrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}

/* real map containers */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,52,.5);display:none;place-items:center;z-index:1000;padding:18px}
.modal-bg.on{display:grid}
.modal{background:var(--bone);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{flex:1;font-size:17px}
.modal-head .x{background:#fff;border:1px solid var(--line-strong);border-radius:8px;width:32px;height:32px;font-size:18px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--indigo);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:2000;opacity:0;transition:transform .25s,opacity .25s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.hide{display:none!important}

.confgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.taglist{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.tag{background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.tag button{border:0;background:transparent;color:var(--madder);font-size:15px;line-height:1;padding:0}

.pickreadout{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
.pickreadout b{color:var(--ink)}
.slip-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13px;color:#000}
.slip-preview h4{font-size:15px;border-bottom:2px solid #000;padding-bottom:6px;margin:0 0 10px}
.slip-preview .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;margin-bottom:10px;font-size:12.5px}
.slip-preview table{width:100%;border:1px solid #000;font-size:11.5px;border-collapse:collapse;margin-top:6px}
.slip-preview th,.slip-preview td{border:1px solid #000;padding:5px}
.field-card{display:flex;gap:12px;align-items:center;background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);min-width:230px}
.field-card .vic{width:38px;height:38px;border-radius:9px;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:none}
.field-card .vic svg{width:20px;height:20px}
.field-card b{font-size:13.5px;display:block}
.field-card .sub{font-size:11.5px;color:var(--ink-soft)}

@media (max-width:860px){
  .app.on{grid-template-columns:1fr}
  .sidebar{display:none}
  .hamb{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line-strong);background:#fff;border-radius:9px}
  .content{padding:16px 14px 90px}
  .grid2,.grid3,.confgrid{grid-template-columns:1fr}
  .minirow{grid-template-columns:24px 1fr auto;grid-auto-rows:auto}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bone);border-top:1px solid var(--line);z-index:60;padding:6px 6px env(safe-area-inset-bottom);justify-content:space-around}
  .mobnav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);font-size:10.5px;font-weight:600;padding:6px 8px;border-radius:9px;flex:1}
  .mobnav button .ic{width:21px;height:21px}
  .mobnav button.active{color:var(--indigo);background:var(--grass-soft)}
  .drawer-bg{position:fixed;inset:0;background:rgba(20,28,52,.5);z-index:90;display:none}
  .drawer-bg.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:264px;background:var(--indigo);z-index:100;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column}
  .drawer.on{transform:none}
}
@media (min-width:861px){.drawer,.drawer-bg{display:none!important}}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;inset:0;padding:0;background:#fff;display:block!important}
}
#printArea{display:none}
.slip{max-width:720px;margin:0 auto;padding:28px;font-size:13px;color:#000}
.slip h2{font-size:18px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
.slip .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:14px}
.slip .grid div{display:flex;gap:6px}
.slip .grid b{min-width:130px}
.slip table{width:100%;border:1px solid #000;font-size:12px;min-width:0}
.slip th,.slip td{border:1px solid #000;padding:6px}
.slip .signs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
.slip .signs div{border-top:1px solid #000;padding-top:6px;font-size:11px;text-align:center}
/* ===== Production additions ===== */
.routechips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 10px}
.routechips button{background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--indigo)}
.routechips button:hover{border-color:var(--indigo-500);background:#fbfcff}
.seg{display:flex;background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--indigo);color:#fff}
.vendorbox{background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:var(--radius);padding:13px 15px;margin-top:10px}
.logoprev{width:76px;height:76px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden}
.logoprev img{width:100%;height:100%;object-fit:contain}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px;border-bottom:1px solid var(--line);padding-bottom:0}
.subtabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:-1px}
.subtabs button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.contactline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.contactline a{font-weight:600}
.editbadge{font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid #ecd9a8;padding:2px 7px;border-radius:999px}
.pill.cancelled{background:#eceae3;color:#7a7565}
.pill.leave_pending{background:var(--amber-soft);color:#9a6712}
.pill.leave_approved{background:var(--grass-soft);color:#3a5e2e}
.pill.leave_rejected{background:var(--madder-soft);color:#82301c}


/* ===== report filter bar ===== */
.repbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:0 0 12px;
  padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.repbar label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.repbar input,.repbar select{height:36px;padding:4px 8px;font-size:13px;min-width:132px}
.repbar .repspace{flex:1 1 auto;min-width:0}
.repbar .btn{height:36px}

/* ===== mobile & tablet ===== */
@media(max-width:860px){
  .repbar{padding:10px}
  .repbar label{flex:1 1 46%;min-width:0}
  .repbar input,.repbar select{min-width:0;width:100%}
  .repbar .repspace{display:none}
  .repbar .btn{flex:1 1 auto}
  .row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .grid2{grid-template-columns:1fr}
  .confgrid{grid-template-columns:1fr}
  table{font-size:12.5px}
  th,td{padding:8px 9px}
  .modal{max-height:88vh}
  .modal-body{max-height:62vh;overflow:auto}
  .modal-foot{flex-wrap:wrap}
  .modal-foot .btn{flex:1 1 auto}
  .btn{min-height:40px}          /* comfortable tap target */
  .btn.sm{min-height:34px}
  .stafftabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .stafftabs button{white-space:nowrap}
  h2{font-size:18px}
}
@media(max-width:420px){
  .repbar label{flex:1 1 100%}
  .row{grid-template-columns:1fr 1fr}
  .stat .n{font-size:20px}
}
/* keep long ids and emails from forcing horizontal scroll */
td,th{word-break:normal;overflow-wrap:anywhere}

/* ===== update banner ===== */
.updatebar{position:fixed;left:12px;right:12px;bottom:12px;z-index:1200;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--indigo);color:#fff;padding:12px 14px;border-radius:12px;
  box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600}
.updatebar span{flex:1 1 180px;min-width:0}
.updatebar .btn{height:34px;flex:0 0 auto}
.updatebar .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
@media(min-width:861px){ .updatebar{left:auto;right:20px;bottom:20px;max-width:440px} }


/* ===== additions for Sahjeevan Operations (new system) (kept separate from the base
   stylesheet above on purpose, so this file stays easy to diff against
   the original styles.css if the two are ever compared) ===== */
.statgrid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px}

<script>
/* ============================================================
   0) Configuration
   ============================================================ */
const SUPABASE_URL = 'https://bcrsaycvmmnnhcrinyev.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MU3bPNSQC-zLH9ONp5PXbg_rPSHUbGW';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   1) Auth
   ============================================================ */
let ME = null, SESSION = null, IS_APPROVER = false;
let REF = { vehicles: [], drivers: [], projects: [] };

async function signIn(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) setLoginStatus(error.message, true);
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }
function setLoginStatus(text, isErr){
  const el = document.getElementById('loginStatus');
  el.textContent = text || '';
  el.className = 'login-status' + (isErr ? ' err' : ' busy');
}

let ENTERING = false;   // guards against running enterApp twice at once
sb.auth.onAuthStateChange((_e, session) => {
  SESSION = session;
  if (session) enterApp(); else showLogin();
});

function showLogin(){
  document.getElementById('loginView').style.display = 'grid';
  document.getElementById('app').classList.remove('on');
}

async function enterApp(){
  // Supabase fires its own initial auth event on page load, on top of the
  // explicit getSession() check at the bottom of this file -- both call
  // enterApp(). Without this guard, sign-in runs twice at once, which is
  // wasteful and could leave two competing sets of data racing to render.
  if (ENTERING) return;
  ENTERING = true;
  try {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('app').classList.add('on');

    const email = (SESSION.user.email || '').toLowerCase();
    const { data: me, error: meErr } = await sb.from('users').select('*').eq('email', email).maybeSingle();
    if (meErr || !me) {
      await sb.auth.signOut();
      showLogin();
      setLoginStatus('Signed in as ' + email + ', but there is no matching record in Users yet. Ask an admin to add you.', true);
      return;
    }
    ME = me;
    document.getElementById('whoName').innerHTML = esc(me.name) + '<small>' + esc(me.role||'') + '</small>';
    document.getElementById('whoName2').textContent = me.name;

    try {
      const [{ data: la }, { data: pc }] = await Promise.all([
        sb.from('leave_approvers').select('staff_email').eq('approver_email', email).limit(1),
        sb.from('project_approval_chains').select('project_id').or(`layer1.eq.${email},layer2.eq.${email}`).limit(1),
      ]);
      IS_APPROVER = !!(la && la.length) || !!(pc && pc.length) || !!(me.is_admin || me.is_super_admin);
    } catch (e) {
      // Not fatal -- worst case, an approver doesn't see the Approvals
      // tab this session. Better than the whole app failing to open.
      IS_APPROVER = !!(me.is_admin || me.is_super_admin);
    }

    await loadReferenceData();
    buildNav();
    await route('home');
  } catch (e) {
    // Whatever else goes wrong here, the person should see a real error
    // instead of a blank page with no menu -- that silence is exactly
    // what made the last bug hard to diagnose from a screenshot alone.
    document.getElementById('content').innerHTML =
      `<div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Something went wrong opening the app: ${esc(e.message||e)}</div></div>`;
  } finally {
    ENTERING = false;
  }
}

/* Last-resort safety net: if anything ELSE throws that isn't already
   caught above, surface it as a toast instead of leaving a silent blank
   screen -- so the next time something breaks, there's at least a visible
   message to report back, rather than a screenshot of empty space. */
window.addEventListener('error', e => { try { toast('Error: ' + (e.message||'something went wrong')); } catch {} });
window.addEventListener('unhandledrejection', e => { try { toast('Error: ' + (e.reason?.message||e.reason||'something went wrong')); } catch {} });

async function loadReferenceData(){
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/reference-data', {
      headers: { Authorization: 'Bearer ' + SESSION.access_token, apikey: SUPABASE_ANON_KEY }
    });
    const json = await res.json();
    if (json.ok) REF = json.data;
  } catch (e) {}
}

/* ============================================================
   2) Calling the Edge Functions
   ============================================================ */
async function callFn(name, body){
  const res = await fetch(SUPABASE_URL + '/functions/v1/' + name, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:'Bearer '+SESSION.access_token, apikey:SUPABASE_ANON_KEY },
    body: JSON.stringify(body || {}),
  });
  try { return await res.json(); } catch { return { ok:false, error:'Unexpected response' }; }
}

/* ============================================================
   3) Nav, drawer, routing
   ============================================================ */
const ICONS = {
  home:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  leave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  compoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  vehicles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-6h14l2 6"/><rect x="2" y="13" width="20" height="6" rx="2"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',
  approvals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>',
};
const TABS = [
  ['home','Home'], ['leave','Leave'], ['compoff','Comp-off'], ['vehicles','Vehicles'], ['approvals','Approvals'],
];
function navButtons(){
  return TABS.filter(([id]) => id !== 'approvals' || IS_APPROVER)
    .map(([id,label]) => `<button data-tab="${id}" onclick="route('${id}')"><span class="ic">${ICONS[id]}</span>${label}</button>`)
    .join('');
}
function buildNav(){
  document.getElementById('navDesktop').innerHTML = navButtons();
  document.getElementById('navDrawer').innerHTML = navButtons();
  document.getElementById('mobnav').innerHTML = navButtons();
}
function setActive(id){
  document.querySelectorAll('.nav button, .mobnav button').forEach(b => b.classList.toggle('active', b.dataset.tab===id));
}
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('on', open);
  document.getElementById('drawerBg').classList.toggle('on', open);
}

const TITLES = {
  home: ['Home',''], leave:['Leave','Raise and track leave'], compoff:['Comp-off','Raise and track comp-off'],
  vehicles:['Vehicles','Book and track vehicle requests'], approvals:['Approvals','Requests waiting on you'],
};
async function route(id){
  setActive(id);
  toggleDrawer(false);
  const [title, sub] = TITLES[id] || [id, ''];
  document.getElementById('pageTitle').innerHTML = esc(title) + (sub ? `<span>${esc(sub)}</span>` : '');
  const content = document.getElementById('content');
  content.innerHTML = '<p class="muted">Loading&hellip;</p>';
  try {
    if (id === 'home') await renderHome(content);
    else if (id === 'leave') await renderLeave(content);
    else if (id === 'compoff') await renderCompOff(content);
    else if (id === 'vehicles') await renderVehicles(content);
    else if (id === 'approvals') await renderApprovals(content);
  } catch (e) {
    content.innerHTML = `<div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Something went wrong loading this: ${esc(e.message||e)}</div></div>`;
  }
}

/* ============================================================
   4) Small helpers
   ============================================================ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(v){
  if (!v) return '\u2014';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return v;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${+m[3]} ${months[+m[2]-1]} ${m[1]}`;
}
function pill(status){ return `<span class="pill ${status}">${String(status).replace('_',' ')}</span>`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function notice(text, kind){
  const icon = kind==='warn'
    ? '<path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/>'
    : '<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>';
  return `<div class="notice ${kind}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg><div>${esc(text)}</div></div>`;
}
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 3200);
}

/* ============================================================
   5) Home
   ============================================================ */
async function renderHome(main){
  let balance = null;
  try { const r = await callFn('leave-balance', {}); if (r.ok) balance = r.data; } catch {}
  main.innerHTML = `
    <div class="pagehead"><div><h3>Welcome, ${esc(ME.name)}</h3>
      <p>${esc(ME.role||'')}${ME.is_admin||ME.is_super_admin?' \u00b7 admin':''}${IS_APPROVER?' \u00b7 approver':''}</p></div></div>
    ${balance ? `
    <div class="card card-pad">
      <div class="statgrid">
        <div class="stat i"><div class="n">${balance.openingCasual}</div><div class="l">Yearly casual allowance, ${balance.year}</div></div>
        <div class="stat a"><div class="n">${balance.used}</div><div class="l">Used so far</div></div>
        <div class="stat g"><div class="n">${balance.remaining}</div><div class="l">Remaining</div></div>
      </div>
    </div>` : ''}
  `;
}

/* ============================================================
   6) Leave
   ============================================================ */
async function renderLeave(main){
  main.innerHTML = `
    <div class="card card-pad" style="margin-bottom:18px">
      <div class="pagehead"><div><h3>Raise leave</h3></div></div>
      <div id="leaveMsg"></div>
      <div class="grid2">
        <div class="field"><label>Type</label><select id="lv_type"><option value="casual">Casual</option><option value="sick">Sick</option></select></div>
        <div></div>
        <div class="field"><label>From</label><input type="date" id="lv_from" value="${todayISO()}"></div>
        <div class="field"><label>To</label><input type="date" id="lv_to" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>Reason</label><textarea id="lv_reason"></textarea></div>
      <button class="btn" id="lv_submit" onclick="submitLeave()">Raise leave</button>
    </div>
    <div class="pagehead"><div><h3>My leave requests</h3></div></div>
    <div id="myLeaves"><p class="muted">Loading&hellip;</p></div>
  `;
  loadMyLeaves();
}
async function submitLeave(){
  const btn = document.getElementById('lv_submit'); btn.disabled = true;
  const body = { leave_type:document.getElementById('lv_type').value, from_date:document.getElementById('lv_from').value,
    to_date:document.getElementById('lv_to').value, reason:document.getElementById('lv_reason').value||null };
  const r = await callFn('leave-request', body);
  const el = document.getElementById('leaveMsg');
  if (r.ok) { el.innerHTML=''; toast('Raised '+r.data.display_id); document.getElementById('lv_reason').value=''; loadMyLeaves(); }
  else el.innerHTML = notice(r.error||'Could not raise leave','warn');
  btn.disabled = false;
}
async function loadMyLeaves(){
  const { data, error } = await sb.from('leaves').select('*').eq('by_email', ME.email).order('created_at',{ascending:false});
  const host = document.getElementById('myLeaves');
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">No leave requests yet.</div>'; return; }
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Type</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody>
    ${data.map(l=>`<tr><td>${esc(l.leave_type)}</td><td>${fmtD(l.from_date)}</td><td>${fmtD(l.to_date)}</td><td>${pill(l.status)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ============================================================

/* ============================================================
   8) Vehicles
   ============================================================ */
async function renderVehicles(main){
  const projectOpts = (REF.projects||[]).map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  main.innerHTML = `
    <div class="card card-pad" style="margin-bottom:18px">
      <div class="pagehead"><div><h3>Raise a vehicle request</h3></div></div>
      <div id="vrMsg"></div>
      <div class="grid2">
        <div class="field"><label>Project</label><select id="vr_project" onchange="onProjectChange()"><option value="">Select&hellip;</option>${projectOpts}</select></div>
        <div class="field"><label>Budget head</label><select id="vr_head"><option value="">Select a project first</option></select></div>
        <div class="field"><label>Date</label><input type="date" id="vr_date" value="${todayISO()}"></div>
        <div class="field"><label>Time</label><input type="time" id="vr_time"></div>
      </div>
      <div class="field"><label>Reason</label><textarea id="vr_reason"></textarea></div>
      <button class="btn" id="vr_submit" onclick="submitVehicleRequest()">Raise request</button>
    </div>
    <div class="pagehead"><div><h3>My vehicle requests</h3></div></div>
    <div id="myVehicles"><p class="muted">Loading&hellip;</p></div>
  `;
  loadMyVehicleRequests();
}
function onProjectChange(){
  const name = document.getElementById('vr_project').value;
  const proj = (REF.projects||[]).find(p=>p.name===name);
  const heads = proj ? (proj.project_budget_heads||[]).filter(h=>h.active) : [];
  document.getElementById('vr_head').innerHTML = heads.length
    ? heads.map(h=>`<option value="${esc(h.budget_head)}">${esc(h.budget_head)}</option>`).join('')
    : '<option value="">No budget heads found</option>';
}
async function submitVehicleRequest(){
  const btn = document.getElementById('vr_submit'); btn.disabled = true;
  const body = { project:document.getElementById('vr_project').value, budget_head:document.getElementById('vr_head').value,
    request_date:document.getElementById('vr_date').value, request_time:document.getElementById('vr_time').value||null,
    reason:document.getElementById('vr_reason').value||null };
  const r = await callFn('vehicle-request', body);
  const el = document.getElementById('vrMsg');
  if (r.ok) { el.innerHTML=''; toast('Raised '+r.data.display_id); loadMyVehicleRequests(); }
  else el.innerHTML = notice(r.error||'Could not raise request','warn');
  btn.disabled = false;
}
async function loadMyVehicleRequests(){
  const { data, error } = await sb.from('vehicle_requests').select('*').eq('by_email', ME.email).order('created_at',{ascending:false});
  const host = document.getElementById('myVehicles');
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">No vehicle requests yet.</div>'; return; }
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Vehicle</th><th>Driver</th><th>Status</th></tr></thead><tbody>
    ${data.map(v=>`<tr><td>${fmtD(v.request_date)}</td><td>${esc(v.vehicle_number||'\u2014')}</td><td>${esc(v.driver_name||'\u2014')}</td><td>${pill(v.status)}${v.escalated?' <span class="muted">(escalated)</span>':''}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ============================================================
   9) Approvals
   ============================================================ */
async function renderApprovals(main){
  main.innerHTML = `
    <div class="pagehead"><div><h3>Leave requests awaiting you</h3></div></div>
    <div id="apLeaves" style="margin-bottom:20px"><p class="muted">Loading&hellip;</p></div>
    <div class="pagehead"><div><h3>Comp-off requests awaiting you</h3></div></div>
    <div id="apCompOff" style="margin-bottom:20px"><p class="muted">Loading&hellip;</p></div>
    <div class="pagehead"><div><h3>Vehicle requests awaiting you</h3></div></div>
    <div id="apVehicles" style="margin-bottom:20px"><p class="muted">Loading&hellip;</p></div>
    ${(ME.is_admin||ME.is_super_admin) ? `<div class="pagehead"><div><h3>Approved vehicle requests</h3><p>Book, start, or close a trip</p></div></div><div id="apAdmin"><p class="muted">Loading&hellip;</p></div>` : ''}
  `;
  loadApprovalLeaves(); loadApprovalCompOff(); loadApprovalVehicles();
  if (ME.is_admin||ME.is_super_admin) loadAdminVehicleActions();
}

async function loadApprovalLeaves(){
  const { data, error } = await sb.from('leaves').select('*').eq('status','leave_pending').order('created_at');
  const host = document.getElementById('apLeaves');
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  const mine = (data||[]).filter(l => l.approver_email?.toLowerCase()===ME.email.toLowerCase() || ME.is_admin || ME.is_super_admin);
  if (!mine.length) { host.innerHTML = '<div class="empty">Nothing waiting on you.</div>'; return; }
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Who</th><th>Type</th><th>From</th><th>To</th><th></th></tr></thead><tbody>
    ${mine.map(l=>`<tr><td>${esc(l.by_name)}</td><td>${esc(l.leave_type)}</td><td>${fmtD(l.from_date)}</td><td>${fmtD(l.to_date)}</td>
      <td><div class="row" style="gap:6px"><button class="btn grass sm" onclick="decideLeave('${l.display_id}','approved')">Approve</button>
      <button class="btn madder sm" onclick="decideLeave('${l.display_id}','rejected')">Reject</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
}
async function decideLeave(id, decision){
  const r = await callFn('leave-decide', { display_id:id, decision });
  if (!r.ok) toast(r.error||'Could not decide'); else toast(decision==='approved'?'Approved':'Rejected');
  loadApprovalLeaves();
}

async function loadApprovalCompOff(){
  const { data, error } = await sb.from('comp_off').select('*').eq('status','comp_pending').order('created_at');
  const host = document.getElementById('apCompOff');
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  const mine = (data||[]).filter(c => c.approver_email?.toLowerCase()===ME.email.toLowerCase() || ME.is_admin || ME.is_super_admin);
  if (!mine.length) { host.innerHTML = '<div class="empty">Nothing waiting on you.</div>'; return; }
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Who</th><th>Worked</th><th>Days</th><th></th></tr></thead><tbody>
    ${mine.map(c=>`<tr><td>${esc(c.by_name)}</td><td>${fmtD(c.worked_date)}</td><td>${c.days}</td>
      <td><div class="row" style="gap:6px"><button class="btn grass sm" onclick="decideCompOff('${c.display_id}','approved')">Approve</button>
      <button class="btn madder sm" onclick="decideCompOff('${c.display_id}','rejected')">Reject</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
}
async function decideCompOff(id, decision){
  const r = await callFn('comp-off-decide', { display_id:id, decision });
  if (!r.ok) toast(r.error||'Could not decide'); else toast(decision==='approved'?'Approved':'Rejected');
  loadApprovalCompOff();
}

async function loadApprovalVehicles(){
  const { data, error } = await sb.from('vehicle_requests').select('*').eq('status','pending').order('created_at');
  const host = document.getElementById('apVehicles');
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">Nothing pending.</div>'; return; }
  host.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Who</th><th>Date</th><th></th></tr></thead><tbody>
    ${data.map(v=>`<tr><td>${esc(v.by_name)}</td><td>${fmtD(v.request_date)}</td>
      <td><div class="row" style="gap:6px">
        <button class="btn grass sm" onclick="decideVehicle('${v.display_id}','approved')">Approve</button>
        <button class="btn madder sm" onclick="decideVehicle('${v.display_id}','rejected')">Reject</button>
        ${!v.escalated ? `<button class="btn ghost sm" onclick="escalateVehicle('${v.display_id}')">Escalate</button>` : '<span class="muted">escalated</span>'}
      </div></td></tr>`).join('')}
  </tbody></table></div>`;
}
async function decideVehicle(id, decision){
  const r = await callFn('vehicle-decide', { display_id:id, decision });
  if (!r.ok) toast(r.error||'Could not decide'); else toast(decision==='approved'?'Approved':'Rejected');
  loadApprovalVehicles();
}
async function escalateVehicle(id){
  const r = await callFn('vehicle-escalate', { display_id:id });
  if (!r.ok) toast(r.error||'Could not escalate'); else toast('Escalated to layer 2');
  loadApprovalVehicles();
}

async function loadAdminVehicleActions(){
  const { data, error } = await sb.from('vehicle_requests').select('*').in('status',['approved','booked','progress']).order('created_at');
  const host = document.getElementById('apAdmin');
  if (error) { host.innerHTML = notice(error.message,'warn'); return; }
  if (!data || !data.length) { host.innerHTML = '<div class="empty">Nothing to action.</div>'; return; }
  const vehicleOpts = (REF.vehicles||[]).map(v=>`<option value="${esc(v.vehicle_number)}">${esc(v.vehicle_number)}</option>`).join('');
  const driverOpts = (REF.drivers||[]).map(d=>`<option value="${esc(d.driver_name)}">${esc(d.driver_name)}</option>`).join('');
  host.innerHTML = data.map(v => {
    if (v.status === 'approved') return `
      <div class="card card-pad" style="margin-bottom:12px">
        <div class="field"><label>${esc(v.display_id)} \u2014 ${esc(v.by_name)}, ${fmtD(v.request_date)} \u2014 book a vehicle</label></div>
        <div class="grid2"><select id="book_veh_${v.request_no}">${vehicleOpts}</select><select id="book_drv_${v.request_no}">${driverOpts}</select></div>
        <button class="btn sm" style="margin-top:10px" onclick="bookVehicle('${v.display_id}',${v.request_no})">Book</button>
      </div>`;
    if (v.status === 'booked') return `
      <div class="card card-pad" style="margin-bottom:12px">
        <div class="field"><label>${esc(v.display_id)} \u2014 ${esc(v.vehicle_number)} / ${esc(v.driver_name)} \u2014 start trip</label>
        <input type="number" id="start_km_${v.request_no}" placeholder="Opening odometer (km)"></div>
        <button class="btn sm" onclick="startTrip('${v.display_id}',${v.request_no})">Start trip</button>
      </div>`;
    return `
      <div class="card card-pad" style="margin-bottom:12px">
        <div class="field"><label>${esc(v.display_id)} \u2014 in progress, opened at ${v.start_km} km \u2014 close trip</label>
        <input type="number" id="end_km_${v.request_no}" placeholder="Closing odometer (km)"></div>
        <button class="btn sm" onclick="closeTrip('${v.display_id}',${v.request_no})">Close trip</button>
      </div>`;
  }).join('');
}
async function bookVehicle(id, reqNo){
  const body = { display_id:id, vehicle_number:document.getElementById('book_veh_'+reqNo).value, driver_name:document.getElementById('book_drv_'+reqNo).value };
  const r = await callFn('vehicle-book', body);
  if (!r.ok) toast(r.error||'Could not book'); else toast('Booked'); loadAdminVehicleActions();
}
async function startTrip(id, reqNo){
  const body = { display_id:id, start_km:Number(document.getElementById('start_km_'+reqNo).value) };
  const r = await callFn('vehicle-start', body);
  if (!r.ok) toast(r.error||'Could not start trip'); else toast('Trip started'); loadAdminVehicleActions();
}
async function closeTrip(id, reqNo){
  const body = { display_id:id, end_km:Number(document.getElementById('end_km_'+reqNo).value) };
  const r = await callFn('vehicle-close', body);
  if (!r.ok) toast(r.error||'Could not close trip'); else toast('Trip closed'); loadAdminVehicleActions();
}

/* ============================================================
   10) Boot
   ============================================================ */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
  if (session) enterApp(); else showLogin();
})();
</script>
